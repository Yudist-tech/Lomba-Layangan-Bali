  /* ---------------- ekspor ---------------- */
  async ekspor() {
    const d = this.s.data, rows = this.hasilFilter();
    const data = rows.map((r) => {
      const x = this.idx.seri.get(r.seri_id), j = this.idx.jenis.get(r.jenis);
      return {
        'Kode': r.kode, 'Tanggal daftar': fmtWaktu(r.created_at), 'Status': STATUS[r.status].label, 'Nomor layangan': r.nomor_layangan || '',
        'Jenis layangan': (j && j.nama) || r.jenis, 'Seri & grup': (x && x.nama) || '', 'Kotak': r.kotak || '', 'Tanggal terbang': fmtTanggal(x && x.tanggal), 'Jam terbang': jamText(x),
        'Nama sekha': r.nama_sekha, 'Alamat': r.alamat, 'Nomor WA': fmtWA(r.no_wa), 'Nama pemilik rekening': r.nama_rekening, 'Biaya (Rp)': r.harga,
        'Cara bayar': caraBayar(r) === 'tunai' ? 'Tunai (manual)' : 'Transfer',
        'WA terkirim': r.wa_terkirim_at ? fmtWaktu(r.wa_terkirim_at) : '', 'WA dikirim oleh': labelOleh(r.wa_oleh),
        'Dikonfirmasi': r.dikonfirmasi_at ? fmtWaktu(r.dikonfirmasi_at) : '', 'Dikonfirmasi oleh': labelOleh(r.dikonfirmasi_oleh), 'Ditolak oleh': labelOleh(r.ditolak_oleh),
        'Alasan ditolak': r.alasan_tolak || '', 'Catatan admin': r.catatan_admin || '',
      };
    });
    const rekap = d.seri.map((x) => {
      const c = this.idx.perSeri.get(x.id);
      return { 'Jenis': this.namaJenis(x.jenis), 'Seri & grup': x.nama, 'Tanggal': fmtTanggal(x.tanggal), 'Jam': jamText(x), 'Kotak': x.kotak || '', 'Kuota': x.kuota, 'Terkonfirmasi': c.terkonfirmasi, 'Menunggu': c.menunggu, 'Ditolak': c.ditolak, 'Sisa': Math.max(0, x.kuota - c.terkonfirmasi - c.menunggu), 'Dibuka': x.aktif ? 'Ya' : 'Tidak' };
    });
    const nama = `pendaftaran-layangan-${isoTanggal(new Date())}`;
    if (!data.length) { toast('Tidak ada data untuk diekspor (cek filter).', 'bad'); return; }
    try {
      const XLSX = await muatSheetJS();
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.json_to_sheet(data);
      ws['!cols'] = Object.keys(data[0]).map((k) => ({ wch: Math.min(40, Math.max(k.length + 2, ...data.slice(0, 200).map((o) => String(o[k]).length + 1))) }));
      XLSX.utils.book_append_sheet(wb, ws, 'Pendaftaran');
      const ws2 = XLSX.utils.json_to_sheet(rekap);
      ws2['!cols'] = Object.keys(rekap[0] || { a: 1 }).map(() => ({ wch: 16 }));
      XLSX.utils.book_append_sheet(wb, ws2, 'Rekap grup');
      const ok = d.daftar.filter((r) => r.status === 'terkonfirmasi');
      const uang = d.jenis.map((j) => {
        const rows = ok.filter((r) => r.jenis === j.kode), tf = rows.filter((r) => caraBayar(r) === 'transfer'), cs = rows.filter((r) => caraBayar(r) === 'tunai');
        const jml = (a) => a.reduce((t, r) => t + (r.harga || 0), 0);
        return { 'Jenis': j.nama, 'Transfer (layangan)': tf.length, 'Transfer (Rp)': jml(tf), 'Tunai (layangan)': cs.length, 'Tunai (Rp)': jml(cs), 'Total (Rp)': jml(rows) };
      }).filter((x) => x['Total (Rp)'] || x['Transfer (layangan)'] || x['Tunai (layangan)']);
      if (uang.length) {
        const sum = (k) => uang.reduce((t, x) => t + x[k], 0);
        uang.push({ 'Jenis': 'TOTAL', 'Transfer (layangan)': sum('Transfer (layangan)'), 'Transfer (Rp)': sum('Transfer (Rp)'), 'Tunai (layangan)': sum('Tunai (layangan)'), 'Tunai (Rp)': sum('Tunai (Rp)'), 'Total (Rp)': sum('Total (Rp)') });
        const ws3 = XLSX.utils.json_to_sheet(uang);
        ws3['!cols'] = Object.keys(uang[0]).map(() => ({ wch: 18 }));
        XLSX.utils.book_append_sheet(wb, ws3, 'Pemasukan');
      }
      XLSX.writeFile(wb, nama + '.xlsx');
      toast(`${data.length} baris diekspor ke Excel`, 'good');
    } catch (e) {
      unduhCSV(data, nama + '.csv');
      toast('Excel tidak bisa dimuat, diunduh sebagai CSV.', 'info', 5000);
    }
  },
};

   PDF KONFIRMASI — kartu digambar di canvas lalu dibungkus jadi PDF A5
   (tanpa pustaka luar; tidak disimpan di server)
   ===================================================================== */
function bungkusPdfJpeg(jpeg, wPx, hPx) {
  const enc = new TextEncoder(), parts = [], offs = [];
  let len = 0;
  const tulis = (x) => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); len += b.length; };
  const W = 419.53, H = 595.28; // A5 dalam point
  const isi = `q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
  tulis('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const obj = (n, body) => { offs[n] = len; tulis(`${n} 0 obj\n`); body(); tulis('\nendobj\n'); };
  obj(1, () => tulis('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => tulis('<< /Type /Pages /Kids [3 0 R] /Count 1 >>'));
  obj(3, () => tulis(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`));
  obj(4, () => { tulis(`<< /Type /XObject /Subtype /Image /Width ${wPx} /Height ${hPx} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`); tulis(jpeg); tulis('\nendstream'); });
  obj(5, () => tulis(`<< /Length ${isi.length} >>\nstream\n${isi}\nendstream`));
  const xref = len;
  tulis(`xref\n0 6\n0000000000 65535 f \n${[1, 2, 3, 4, 5].map((n) => String(offs[n]).padStart(10, '0') + ' 00000 n \n').join('')}`);
  tulis(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts, { type: 'application/pdf' });
}
async function muatGambarAman(url) {
  const u = urlGambarAman(url);
  if (!u) return null;
  try {
    const src = u.startsWith('data:') ? u : URL.createObjectURL(await (await fetch(u, { mode: 'cors' })).blob());
    const img = new Image();
    await new Promise((ok, gagal) => { img.onload = ok; img.onerror = gagal; img.src = src; });
    return img;
  } catch (e) { return null; }
}
function bungkusTeks(ctx, teks, lebar) {
  const kata = String(teks || '').split(/\s+/), baris = [];
  let b = '';
  for (const k of kata) {
    const coba = b ? b + ' ' + k : k;
    if (ctx.measureText(coba).width > lebar && b) { baris.push(b); b = k; } else b = coba;
  }
  if (b) baris.push(b);
  return baris.length ? baris : [''];
}
async function buatPdfKonfirmasi(d) {

    ov.addColorStop(0, 'rgba(6,28,56,.72)'); ov.addColorStop(0.55, 'rgba(6,28,56,.45)'); ov.addColorStop(1, 'rgba(6,28,56,.62)');

    x.fillStyle = g; x.fillRect(0, 0, W, 240);
  }
  let tx = M;
  if (logo) {
    x.fillStyle = '#ffffff'; kotakBulat(M, 45, 150, 150, 22); x.fill();
    const sk = Math.min(126 / logo.naturalWidth, 126 / logo.naturalHeight), lw = logo.naturalWidth * sk, lh = logo.naturalHeight * sk;
    x.drawImage(logo, M + 75 - lw / 2, 120 - lh / 2, lw, lh);
    tx = M + 180;
  }
  x.fillStyle = '#ffffff'; x.textBaseline = 'alphabetic';
  font(44, 800);
  const judul = bungkusTeks(x, d.ev.nama_event || 'Lomba Layangan', W - tx - M).slice(0, 2);
  let y = judul.length > 1 ? 95 : 115;
  judul.forEach((t) => { x.fillText(t, tx, y); y += 50; });
  font(25, 500); x.fillStyle = 'rgba(255,255,255,.88)';
  x.fillText([d.ev.penyelenggara, d.ev.lokasi].filter(Boolean).join(' · ').slice(0, 70), tx, y + 4);
  // judul dokumen
  y = 305; x.fillStyle = '#16181d'; font(40, 800); x.fillText('KONFIRMASI PENDAFTARAN', M, y);
  font(25, 500); x.fillStyle = '#474a53'; x.fillText('Pembayaran sudah diterima. Layangan Anda resmi terdaftar.', M, y + 42);
  font(22, 800); const pill = 'TERDAFTAR', pw = x.measureText(pill).width + 40;
  x.fillStyle = '#e6f5e8'; kotakBulat(W - M - pw, y - 34, pw, 46, 23); x.fill();
  x.fillStyle = '#0a6b24'; x.fillText(pill, W - M - pw + 20, y - 3);
  // nomor layangan
  y = 385; x.fillStyle = '#e8f1fb'; kotakBulat(M, y, W - 2 * M, 260, 26); x.fill();
  x.textAlign = 'center'; x.fillStyle = '#0b4a8b'; font(24, 800); x.fillText('NOMOR LAYANGAN', W / 2, y + 50);
  font(140, 800); x.fillText(String(d.nomor || '-'), W / 2, y + 185);
  font(30, 700); x.fillStyle = '#16181d'; x.fillText(String(d.jenis || '').toUpperCase(), W / 2, y + 235);
  x.textAlign = 'left';
  // bagian data
  const bagian = (judulB, baris, y0) => {
    font(22, 800); x.fillStyle = '#0e5aa7'; x.fillText(judulB, M, y0);
    x.fillStyle = '#d2cec3'; x.fillRect(M, y0 + 14, W - 2 * M, 2);
    let yy = y0 + 58;
    baris.forEach(([k, v]) => {
      font(24, 500); x.fillStyle = '#6b6e76'; x.fillText(k, M, yy);
      font(27, 700); x.fillStyle = '#16181d';
      const ls = bungkusTeks(x, v || '-', W - M - 330).slice(0, 2);
      ls.forEach((t, i) => x.fillText(t, 330, yy + i * 34));

  };

  bagian('JADWAL TERBANG', [['Tanggal', d.tanggal], ['Seri & grup', d.seri], ['Jam terbang', d.jam], ['Posisi di jadwal', d.kotak ? 'Kotak ' + d.kotak : '-']], y + 26);
  // kaki

  font(22, 600); x.fillStyle = '#16181d';
  bungkusTeks(x, 'Pasang nomor layangan pada layangan dan hadir paling lambat 30 menit sebelum jadwal seri.', W - 2 * M).slice(0, 2).forEach((t, i) => x.fillText(t, M, H - 88 + i * 30));
  font(19, 500); x.fillStyle = '#6b6e76';

  return bungkusPdfJpeg(new Uint8Array(await blob.arrayBuffer()), W, H);
}

function unduhCSV(rows, nama) {
  const kolom = Object.keys(rows[0] || {});
  const sel = (v) => {
    let s = String(v ?? '');
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const csv = '﻿' + [kolom.map(sel).join(','), ...rows.map((r) => kolom.map((k) => sel(r[k])).join(','))].join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = nama; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
async function sibuk(el, fn) {
  if (!el || el.disabled) return;
  const asli = el.innerHTML;
  el.disabled = true;
  el.innerHTML = '<span class="spinner"></span>' + (el.classList.contains('btn-icon') ? '' : ' Memproses…');
  try { return await fn(); }
  finally { if (el.isConnected) { el.disabled = false; el.innerHTML = asli; } }
}

  const t = e.target;

function awalanJenis(nama, terpakai) {
  const huruf = String(nama || '').toUpperCase().replace(/[^A-Z0-9 ]/g, '').trim();

  const kata = huruf.split(/\s+/);
  const kandidat = [kata.length > 1 ? kata.map((k) => k[0]).join('').slice(0, 3) : '', (huruf.replace(/\s+/g, '')[0] || '') + (huruf.replace(/[\sAIUEO]/g, '').slice(1, 2) || huruf.replace(/\s+/g, '')[1] || ''), huruf.replace(/\s+/g, '').slice(0, 3)].filter(Boolean);
  for (const k of kandidat) if (!terpakai.has(k)) return k;
  const dasar = kandidat[0].slice(0, 3);
  for (let i = 2; i < 100; i++) if (!terpakai.has(dasar + i)) return (dasar + i).slice(0, 5);
  return dasar;
}

/* ---------- tanggal & status event ---------- */
function hariIniIso() { const b = bagianWaktu(new Date()); return b ? `${b.y}-${pad2(b.m)}-${pad2(b.d)}` : isoTanggal(new Date()); }
function selisihHari(a, b) { return Math.round((parseTanggal(b) - parseTanggal(a)) / 86400000); }
function statusEvent(e, hariIni = hariIniIso()) {
  const m = e.tanggal_mulai, s = e.tanggal_selesai || m;
  if (!m) return { k: 'tbd', label: 'Tanggal menyusul', urut: 3 };
  if (s < hariIni) return { k: 'selesai', label: 'Selesai', urut: 4 };
  if (m <= hariIni) {
    const ke = selisihHari(m, hariIni) + 1, total = selisihHari(m, s) + 1;
    return { k: 'live', label: total > 1 ? `Berlangsung · hari ke-${ke}` : 'Berlangsung hari ini', urut: 0 };
  }
  const n = selisihHari(hariIni, m);
  return { k: n <= 14 ? 'segera' : 'jauh', n, label: n === 1 ? 'Besok' : `${n} hari lagi`, urut: n <= 14 ? 1 : 2 };
}
function rentangEvent(e, pendek = false) {
  const a = parseTanggal(e.tanggal_mulai), b = parseTanggal(e.tanggal_selesai) || a;
  if (!a) return 'Tanggal menyusul';
  const B = pendek ? BLN : BULAN;
  if (a.getTime() === b.getTime()) return `${pendek ? HARI3[a.getDay()] : HARI[a.getDay()]}, ${a.getDate()} ${B[a.getMonth()]} ${a.getFullYear()}`;
  if (a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear()) return `${a.getDate()}–${b.getDate()} ${B[a.getMonth()]} ${a.getFullYear()}`;
  return `${a.getDate()} ${BLN[a.getMonth()]} – ${b.getDate()} ${BLN[b.getMonth()]} ${b.getFullYear()}`;
}
const urutEvent = (a, b) => (a._st.urut - b._st.urut) || (a._st.k === 'selesai'
  ? String(b.tanggal_mulai).localeCompare(String(a.tanggal_mulai))
  : String(a.tanggal_mulai || '9999').localeCompare(String(b.tanggal_mulai || '9999')));
const slugEvent = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+/, '').slice(0, 40).replace(/-+$/, '');
function hashTeks(t) { let h = 7; for (const c of String(t)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }

/* Poster bawaan bila panitia belum mengunggah gambar latar: langit, matahari & layangan */
const PALET_POSTER = [
  ['#0b3d78', '#3a95d8', '#ffd27a', '#ff7a59'], ['#4a2377', '#d9628a', '#ffc56b', '#2ec4b6'], ['#0f5c55', '#37b39a', '#f9e27a', '#ff6b6b'],
  ['#7a2a18', '#ef8a3c', '#ffe08a', '#2b6cb0'], ['#14365c', '#5aa6c9', '#ffeab0', '#e94f37'], ['#3b2a6b', '#7f6fd6', '#ffd6a0', '#f9c80e'],
];
function seniPoster(slug) {
  const h = hashTeks(slug), [c0, c1, sun, ak] = PALET_POSTER[h % PALET_POSTER.length];
  const g = `g${h.toString(36)}`;
  const kite = (x, y, sk, rot, warna) => `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${sk})">
    <path d="M0 52c-9 16 9 26 0 42s9 26 0 42" fill="none" stroke="${warna}" stroke-width="3" stroke-linecap="round" opacity=".9"/>
    <path d="M0-44 28 0 0 52-28 0z" fill="${warna}"/><path d="M0-44 28 0H0z" fill="#fff" opacity=".28"/><path d="M0-44V52M-28 0h56" stroke="rgba(0,0,0,.28)" stroke-width="1.6"/></g>`;
  const x1 = 70 + (h % 50), x2 = 190 + ((h >> 3) % 50), y1 = 120 + ((h >> 5) % 40);
  return `<svg class="tp-art" viewBox="0 0 300 360" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c0}"/><stop offset="1" stop-color="${c1}"/></linearGradient></defs>
    <rect width="300" height="360" fill="url(#${g})"/>
    <circle cx="${230 - (h % 60)}" cy="92" r="44" fill="${sun}" opacity=".92"/><circle cx="${230 - (h % 60)}" cy="92" r="66" fill="${sun}" opacity=".16"/>
    <path d="M${x1} ${y1 + 50}Q${x1 + 40} 250 150 340M${x2} ${y1 - 10}Q${x2 - 20} 240 150 340" fill="none" stroke="#fff" stroke-width="1" opacity=".45"/>
    ${kite(x1, y1, 0.9, -14, ak)}${kite(x2, y1 - 60, 0.62, 12, '#fff')}${kite(250 - ((h >> 7) % 30), 215, 0.36, 8, sun)}
    <path d="M0 300c40-14 70-14 100-4s60 14 100 2 70-10 100 0V360H0z" fill="#fff" opacity=".16"/>
    <path d="M0 322c50-10 80-6 120 4s80 10 180-6V360H0z" fill="${c0}" opacity=".55"/></svg>`;
}
/* Flyer bawaan bila panitia belum mengunggah flyer: A4 tegak dengan nama, tanggal & lokasi */
function flyerBawaan(e) {
  const h = hashTeks(e.slug), [c0, c1, sun, ak] = PALET_POSTER[h % PALET_POSTER.length], g = `fb${h.toString(36)}`;
  const kata = String(e.nama_event || 'Lomba Layangan').toUpperCase().split(/\s+/), baris = [];
  let b = '';
  kata.forEach((k) => { if ((b + ' ' + k).trim().length > 13 && b) { baris.push(b); b = k; } else b = (b + ' ' + k).trim(); });
  if (b) baris.push(b);
  const judul = baris.slice(0, 4), uk = judul.length > 3 ? 19 : 22, y0 = 168 - (judul.length - 1) * (uk + 2);
  const a = parseTanggal(e.tanggal_mulai);
  const kite = (x, y, sk, rot, w) => `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${sk})"><path d="M0 52c-9 16 9 26 0 42s9 26 0 42" fill="none" stroke="${w}" stroke-width="3" stroke-linecap="round"/><path d="M0-44 28 0 0 52-28 0z" fill="${w}"/><path d="M0-44 28 0H0z" fill="#fff" opacity=".3"/></g>`;
  return `<svg viewBox="0 0 210 297" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Flyer ${esc(e.nama_event)}">
    <defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c0}"/><stop offset="1" stop-color="${c1}"/></linearGradient></defs>
    <rect width="210" height="297" fill="url(#${g})"/>
    <circle cx="${150 - (h % 30)}" cy="62" r="34" fill="${sun}" opacity=".9"/>
    ${kite(52 + (h % 20), 66, 0.6, -12, ak)}${kite(172, 96, 0.36, 10, '#fff')}
    <text x="105" y="22" text-anchor="middle" fill="#fff" opacity=".85" font-size="8" font-weight="800" letter-spacing="2.4" font-family="Plus Jakarta Sans, sans-serif">LOMBA LAYANGAN</text>
    ${judul.map((t, i) => `<text x="105" y="${y0 + i * (uk + 2)}" text-anchor="middle" fill="#fff" font-size="${uk}" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">${esc(t)}</text>`).join('')}
    <rect x="62" y="196" width="86" height="34" rx="6" fill="#fff"/>
    <text x="105" y="212" text-anchor="middle" fill="${c0}" font-size="13" font-weight="800" font-family="Plus Jakarta Sans, sans-serif">${a ? esc(`${a.getDate()} ${BLN[a.getMonth()].toUpperCase()}`) : 'SEGERA'}</text>
    <text x="105" y="224" text-anchor="middle" fill="${c0}" font-size="7.5" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">${a ? a.getFullYear() : ''}</text>
    <text x="105" y="250" text-anchor="middle" fill="#fff" font-size="8.5" font-weight="700" font-family="Plus Jakarta Sans, sans-serif">${esc(String(e.lokasi || '').slice(0, 34))}</text>
    <path d="M0 262c40-10 70-10 105-2s70 10 105 0V297H0z" fill="#000" opacity=".18"/>
    <text x="105" y="284" text-anchor="middle" fill="#fff" opacity=".9" font-size="7" font-weight="700" letter-spacing="1.2" font-family="Plus Jakarta Sans, sans-serif">DAFTAR ONLINE</text></svg>`;
}
function stEvent(st) { return `<span class="ev-st st-${st.k}">${st.k === 'live' ? '<i></i>' : ''}${esc(st.label)}</span>`; }

/* ---------- HALAMAN DEPAN: semua event ---------- */
const SITUS_AWAL = {
  nama: 'Lomba Layangan Bali',
  judul: 'Semua lomba layangan, satu tempat daftar.',
  teks: 'Pilih event, isi data layangan, transfer, dan unggah bukti. Nomor & jadwal terbang langsung terlihat.',
  logo_url: '', bg_url: '',

const logoSitus = (st, cls = '') => {
  const u = urlGambarAman(st && st.logo_url);
  return u ? `<span class="brand-logo has-img ${cls}"><img src="${esc(u)}" alt=""></span>` : `<span class="brand-logo ${cls}">${KITE_LOGO}</span>`;
};
const Beranda = {
  s: { list: null, situs: null, err: null, loading: false },
  mount() {
    document.body.classList.remove('is-admin');
    document.title = 'Lomba Layangan Bali — Semua event';
    this.render();
    this.muat();
  },
  async muat() {
    if (this.s.loading) return;
    this.s.loading = true;
    try { [this.s.list, this.s.situs] = await Promise.all([api.daftarEvent(), api.infoSitus()]); this.s.err = null; } catch (e) { this.s.err = pesanError(e); }
    this.s.loading = false;
    if (this.s.situs) document.title = `${this.s.situs.nama} — Semua event`;
    this.render();
  },
  render() { if (Router.aktif === 'beranda') $('#app').innerHTML = this.halaman(); },
  vTidakAda(slug) {
    document.body.classList.remove('is-admin');
    $('#app').innerHTML = `${demoBar()}<div class="login-wrap"><div class="card login">
      <h2 class="h2">Event tidak ditemukan</h2>
      <p class="lead">Alamat <b>${esc(slug)}</b> tidak cocok dengan event mana pun. Mungkin event sudah dihapus atau alamatnya salah ketik.</p>
      <a class="btn btn-primary btn-block" href="#">${ico('arrow-l')} Lihat semua event</a></div></div>`;
  },
  halaman() {
    const list = (this.s.list || []).map((e) => ({ ...e, _st: statusEvent(e) })).sort(urutEvent);
    const dekat = list.filter((e) => e._st.k === 'live' || e._st.k === 'segera');
    const jauh = list.filter((e) => e._st.k === 'jauh' || e._st.k === 'tbd');
    const selesai = list.filter((e) => e._st.k === 'selesai');
    let isi;
    if (!this.s.list && this.s.err) isi = `<div class="card"><div class="note bad">${ico('alert')}<span>${esc(this.s.err)}</span></div><button class="btn btn-primary" data-act="lp.muat">${ico('refresh')} Coba lagi</button></div>`;
    else if (!this.s.list) isi = `<div class="ev-grid">${'<div class="ev-card"><div class="skel" style="height:236px;width:100%"></div></div>'.repeat(2)}</div>`;
    else {
      isi = `
      <section class="lp-sec" aria-labelledby="lp-dekat">
        <div class="lp-h"><h2 id="lp-dekat">Berlangsung & segera</h2><span>Hari ini sampai 2 minggu ke depan</span></div>
        ${dekat.length ? `<div class="ev-grid">${dekat.map((e) => this.vTiket(e)).join('')}</div>`
          : `<div class="lp-kosong">${ico('cal')}<span>Belum ada lomba dalam 2 minggu ke depan. Lihat kalender di bawah.</span></div>`}
      </section>
      <section class="lp-sec" aria-labelledby="lp-jauh">
        <div class="lp-h"><h2 id="lp-jauh">Kalender lomba</h2><span>Lebih dari 2 minggu lagi</span></div>
        ${jauh.length ? this.vKalender(jauh) : `<div class="lp-kosong">${ico('cal')}<span>Belum ada event lain yang dijadwalkan.</span></div>`}
      </section>
      ${selesai.length ? `<section class="lp-sec" aria-labelledby="lp-selesai">
        <div class="lp-h"><h2 id="lp-selesai">Sudah selesai</h2><span>Jadwal & nomor peserta tetap bisa dilihat</span></div>
        <div class="kal-card selesai">${selesai.map((e) => this.vBaris(e, true)).join('')}</div>
      </section>` : ''}`;
    }
    const nAktif = list.filter((e) => e._st.k !== 'selesai').length, nBuka = list.filter((e) => e.pendaftaran_buka && e._st.k !== 'selesai').length;
    const st = this.s.situs || SITUS_AWAL, bg = urlGambarAman(st.bg_url);
    const gayaBg = bg ? ` style="background-image:linear-gradient(170deg,rgba(6,28,56,.74) 0%,rgba(6,28,56,.42) 55%,rgba(6,28,56,.66) 100%),url('${esc(bg)}')"` : '';
    return `${demoBar()}<header class="lp-top${bg ? ' has-bg' : ''}"${gayaBg}><div class="lp-in">
        <div class="lp-bar"><a class="lp-brand" href="#">${logoSitus(st)}<b>${esc(st.nama)}</b></a>
          <a class="btn btn-sm lp-masuk" href="#panitia">${ico('lock')} Masuk panitia</a></div>
        <h1>${esc(st.judul)}</h1>
        ${st.teks ? `<p>${esc(st.teks)}</p>` : ''}
        ${this.s.list ? `<div class="hero-chips"><span class="chip"><i class="dot"></i>${nBuka} event buka pendaftaran</span><span class="chip">${ico('cal')}${nAktif} event mendatang</span></div>` : ''}
      </div>${bg ? '' : HERO_ART}${HERO_WAVES}</header>
      <main class="lp-main" id="main">${isi}
        <footer class="pub-foot"><div class="foot-s">${esc(st.nama)} · <a href="#panitia">Masuk panitia</a></div></footer>
      </main>`;
  },
  /* poster ala tiket bioskop */
  /* kartu event: flyer A4 dari panitia di kiri, info di kanan */
  vTiket(e) {
    const st = e._st, fl = urlGambarAman(e.flyer_url);
    const [c0, c1] = PALET_POSTER[hashTeks(e.slug) % PALET_POSTER.length];
    const cta = e.juara_diumumkan ? ['gold', '🏆 Lihat juara', '/juara'] : e.pendaftaran_buka ? ['primary', 'Daftar sekarang', ''] : st.k === 'live' ? ['', 'Lihat jadwal', '/jadwal'] : ['', 'Lihat info', ''];
    const href = `#e/${encodeURIComponent(e.slug)}${cta[2]}`;
    const chips = e.pendaftaran_buka
      ? `<span class="ev-chip buka">Pendaftaran dibuka</span>${e.ada_jadwal ? `<span class="ev-chip">Sisa ${angka(e.sisa_slot)} kotak</span>` : ''}${e.harga_min != null ? `<span class="ev-chip">Mulai ${rupiah(e.harga_min)}</span>` : ''}`
      : `<span class="ev-chip">${st.k === 'live' ? 'Pendaftaran ditutup' : 'Pendaftaran belum dibuka'}</span>${e.peserta ? `<span class="ev-chip">${angka(e.peserta)} layangan</span>` : ''}`;
    const chipJuara = e.juara_diumumkan ? '<span class="ev-chip juara">🏆 Juara diumumkan</span>' : '';
    return `<article class="ev-card" style="--ev-a:${c0};--ev-b:${c1}">
      <div class="ev-sisi">
        <div class="ev-flyer${fl ? ' ada' : ''}">${fl ? `<img src="${esc(fl)}" alt="Flyer ${esc(e.nama_event)}" loading="lazy" decoding="async">` : flyerBawaan(e)}</div>
        ${fl ? `<button type="button" class="ev-zoom" data-act="lp.flyer" data-url="${esc(fl)}" data-judul="Flyer ${esc(e.nama_event)}" aria-label="Perbesar flyer ${esc(e.nama_event)}">${ico('eye')}</button>` : ''}
      </div>
      <div class="ev-body">
        <div class="ev-atas">${stEvent(st)}</div>
        <div class="ev-org">${esc(e.penyelenggara)}</div>
        <h3 class="ev-judul"><a class="ev-link" href="${href}">${esc(e.nama_event)}</a></h3>
        <ul class="ev-meta"><li>${ico('cal')}<span>${esc(rentangEvent(e))}</span></li><li>${ico('pin')}<span>${esc(e.lokasi || 'Lokasi menyusul')}</span></li></ul>
        <div class="ev-chips">${chipJuara}${chips}</div>
        <div class="ev-aksi"><span class="ev-cta ${cta[0]}">${cta[1]} ${ico('arrow-r')}</span>
          ${fl ? `<button type="button" class="ev-lihat" data-act="lp.flyer" data-url="${esc(fl)}" data-judul="Flyer ${esc(e.nama_event)}">${ico('image')} Flyer</button>` : ''}</div>
      </div>
    </article>`;
  },
  /* event yang masih jauh: daftar kalender per bulan */
  vKalender(list) {
    const grup = new Map();
    list.forEach((e) => {
      const a = parseTanggal(e.tanggal_mulai), k = a ? `${BULAN[a.getMonth()]} ${a.getFullYear()}` : 'Tanggal menyusul';
      if (!grup.has(k)) grup.set(k, []);
      grup.get(k).push(e);
    });
    return [...grup].map(([bulan, rows]) => `<div class="kal-bulan">${esc(bulan)}</div><div class="kal-card">${rows.map((e) => this.vBaris(e, false)).join('')}</div>`).join('');
  },
  vBaris(e, selesai) {
    const a = parseTanggal(e.tanggal_mulai), b = parseTanggal(e.tanggal_selesai);
    const tgl = a ? (b && b.getTime() !== a.getTime() ? `${a.getDate()}–${b.getDate()}` : String(a.getDate())) : '?';
    const chip = selesai && e.juara_diumumkan ? '<span class="ev-st st-juara">🏆 Lihat juara</span>' : selesai ? `<span class="ev-st st-selesai">${angka(e.peserta)} layangan ikut</span>`
      : e.pendaftaran_buka ? '<span class="ev-st st-buka">Pendaftaran dibuka</span>' : '<span class="ev-st st-jauh">Belum dibuka</span>';
    return `<a class="kal-row" href="#e/${encodeURIComponent(e.slug)}${selesai ? (e.juara_diumumkan ? '/juara' : '/jadwal') : ''}">
      <div class="kal-tgl${tgl.includes('–') ? ' rng' : ''}"><b>${tgl}</b><span>${a ? (selesai ? BLN[a.getMonth()] + ' ' + String(a.getFullYear()).slice(2) : HARI3[a.getDay()]) : ''}</span></div>
      <div class="kal-info"><b>${esc(e.nama_event)}</b><span>${ico('pin')}${esc(e.lokasi || 'Lokasi menyusul')}${!selesai && e.harga_min != null ? ` · mulai ${rupiah(e.harga_min)}` : ''}</span></div>
      <div class="kal-kanan">${chip}${!selesai ? `<span class="kal-sisa">${esc(e._st.label)}</span>` : ''}</div>
      ${ico('chev-r', 'kal-chev')}
    </a>`;
  },
};
ACT['lp.muat'] = () => Beranda.muat();

/* ---------- RUANG PANITIA: daftar event, buat event (super admin), akses panitia ---------- */
const AKUN_DEMO = [
  ['superadmin@demo.id', 'Super admin', 'Membuat event & memberi akses'],
  ['panitia.sanur@demo.id', 'Panitia Sanur', '3 event'],
  ['panitia.kusamba@demo.id', 'Panitia Kusamba', '1 event'],
];
function akunDemo(act) {

    `<button type="button" class="akun-btn" data-act="${act}" data-email="${esc(email)}"><b>${esc(nama)}</b><span>${esc(email)} · ${esc(ket)}</span></button>`).join('')}</div>`;
}
const Pusat = {
  s: { sesi: undefined, peran: null, list: null, err: null, loading: false, loginErr: null, loginBusy: false, tab: 'event', situs: null, akses: null, edit: null },
  async mount(sub) {
    this.s.tab = ['event', 'akses', 'situs', 'sandi'].includes(sub) ? sub : 'event';
    this.s.edit = null;
    document.body.classList.remove('is-admin');
    document.title = 'Ruang panitia — Lomba Layangan';
    if (this.s.sesi === undefined) this.render();
    this.s.sesi = await api.sesi().catch(() => null);
    if (!this.s.sesi) { this.s.peran = null; this.s.list = null; this.render(); return; }
    this.s.peran = await api.peran();
    this.render();
    this.muat();
  },
  async muat() {
    this.s.loading = true;
    try {
      const sup = this.super;
      const [list, situs, akses, nama] = await Promise.all([api.eventSaya(), sup ? api.infoSitus() : null, sup ? api.daftarAkses() : null, api.namaPanitia ? api.namaPanitia() : {}]);
      Object.assign(this.s, { list, situs, akses, nama: nama || {}, err: null });
    } catch (e) { this.s.err = pesanError(e); }
    this.s.loading = false;
    this.render();
  },
  get super() { return !!(this.s.peran && this.s.peran.peran === 'super'); },
  render() {
    if (Router.aktif !== 'pusat') return;
    const s = this.s, app = $('#app');
    if (s.sesi === undefined) { Adm.tampilMemuat(app, 'Memeriksa akun…', 'Sebentar, layangan sedang naik'); return; }
    if (!s.sesi) { app.innerHTML = this.vLogin(); return; }
    const isi = s.tab === 'sandi' ? this.vSandi() : !this.super || s.tab === 'event' ? this.vIsi() : s.tab === 'akses' ? this.vAkses() : this.vSitus();
    app.innerHTML = `${demoBar()}${this.vTop()}<main class="pz-main" id="main">${this.super ? this.vTabs() : ''}${isi}</main>`;
  },
  vTabs() {
    const t = this.s.tab, n = this.s.akses ? this.s.akses.length : 0;
    const item = (id, label, ikon, c) => `<a class="pz-tab ${t === id ? 'on' : ''}" href="#panitia${id === 'event' ? '' : '/' + id}" ${t === id ? 'aria-current="page"' : ''}>${ico(ikon)}${label}${c ? `<small>${c}</small>` : ''}</a>`;
    return `<nav class="pz-tabs" aria-label="Menu super admin">${item('event', 'Event', 'cal')}${item('akses', 'Admin event', 'users', n)}${item('situs', 'Pengaturan situs', 'sliders')}</nav>`;
  },
  /* ---- tab: admin event (semua panitia & event yang dipegang) ---- */
  vAkses() {
    const s = this.s, list = s.akses;
    const head = `<div class="pz-head"><div><h1>Admin event</h1>
      <p class="lead">ID dan email yang diberi akses dashboard event. Reset password, ganti email, atau cabut akses di sini, atau dari tombol ${ico('sliders', 'ico-inline')} di kartu event.</p></div></div>`;
    if (!list) return head + (s.err ? `<div class="note bad">${ico('alert')}<span>${esc(s.err)}</span></div>` : '<div class="panel"><div class="skel" style="height:140px"></div></div>');
    if (!list.length) return head + `<div class="lp-kosong">${ico('info')}<span>Belum ada admin event. Tambahkan email dari tombol ${ico('sliders', 'ico-inline')} di kartu event.</span></div>`;
    return head + `<div class="ak-list">${list.map((p) => {
      const sedangUbah = s.edit && s.edit.mode === 'orang' && s.edit.email === p.email;
      return `<article class="ak-card">
        <div class="ak-top">
          ${sedangUbah ? this.vFormGanti('orang', '', p.email)
            : `<div class="ak-who">${akunId(p.email) ? '<span class="ak-av id">ID</span>' : `<span class="ak-av">${esc(p.email[0].toUpperCase())}</span>`}<div><b${akunId(p.email) ? ' class="mono"' : ''}>${esc(namaAkun(p.email))}</b><span>${namaLengkap(p.email) ? `${esc(namaLengkap(p.email))} · ` : akunId(p.email) ? 'Akun ID · ' : ''}${p.events.length} event</span></div></div>
          <div class="ak-aksi">${akunId(p.email) ? `<button class="btn btn-xs" data-act="pusat.resetId" data-email="${esc(p.email)}">${ico('lock')} Reset password</button>` : `<button class="btn btn-xs" data-act="pusat.ubahOrang" data-email="${esc(p.email)}">${ico('edit')} Ganti email</button>`}
            ${akunId(p.email) ? `<button class="btn btn-xs btn-danger" data-act="pusat.hapusAkun" data-email="${esc(p.email)}">${ico('trash')} Hapus akun</button>` : `<button class="btn btn-xs btn-danger" data-act="pusat.cabutSemua" data-email="${esc(p.email)}">${ico('x')} Cabut semua akses</button>`}</div>`}
        </div>
        <ul class="ak-ev">${p.events.map((e) => `<li><span><b>${esc(e.nama_event)}</b><small>${esc(rentangEvent(e, true))}</small></span>
          <button class="btn btn-xs btn-ghost" data-act="pusat.cabut" data-id="${e.id}" data-email="${esc(p.email)}" aria-label="Cabut akses ${esc(p.email)} dari ${esc(e.nama_event)}">${ico('x')} Cabut</button></li>`).join('')}</ul>
      </article>`;
    }).join('')}</div>`;
  },

/* =====================================================================
   7) ROUTER, EVENT GLOBAL & START
   ===================================================================== */
/* Alamat:  #            → halaman depan (semua event)
            #panitia     → ruang panitia (super admin: semua event + buat event)
            #e/<kode>/…  → halaman peserta event (#e/<kode>/jadwal, /cek, /tiket/KODE)
            #e/<kode>/admin/… → dashboard panitia event itu
   Link lama di dalam halaman event (#jadwal, #admin/…) otomatis diberi awalan event yang sedang dibuka. */
async function rute() {
  if (/(^#?\/?|&)(access_token|error)=/.test(location.hash)) await tangkapLinkEmail();
  let h = location.hash.replace(/^#\/?/, '');
  try { h = decodeURIComponent(h); } catch (e) { /* hash rusak: pakai apa adanya */ }
  let p = h.split('/');
  Overlay.tutupSemua();
  if (p[0] === 'e' && p[1]) {
    const slug = p[1].toLowerCase();
    p = p.slice(2);
    if (!(await gantiEvent(slug))) { Router.aktif = 'beranda'; Beranda.vTidakAda(slug); return; }
  } else if (p[0] === 'panitia') { Router.aktif = 'pusat'; Pusat.mount(p[1]); return; }
  else if (!p[0] || p[0] === 'semua') { Router.aktif = 'beranda'; Beranda.mount(); return; }
  else if (p[0] === 'tiket' && p[1]) {           // link konfirmasi lama tanpa kode event
    const slug = await api.cariEventTiket(p[1]).catch(() => null);
    if (slug) { location.replace(`#e/${slug}/tiket/${encodeURIComponent(p[1])}`); return; }
    history.replaceState(null, '', '#'); Router.aktif = 'beranda'; Beranda.mount(); return;
  } else if (Ev.slug && Ev.ada && (Router.aktif === 'pub' || Router.aktif === 'adm')) {
    history.replaceState(null, '', hrefEv(h));     // link di dalam halaman event (#jadwal, #admin/…)
  } else {
    history.replaceState(null, '', p[0] === 'admin' ? '#panitia' : '#');
    if (p[0] === 'admin') { Router.aktif = 'pusat'; Pusat.mount(); } else { Router.aktif = 'beranda'; Beranda.mount(); }
    return;
  }
  const [bag, sub] = p;
  if (bag === 'admin') { Router.aktif = 'adm'; Adm.mount(sub); }
  else { Router.aktif = 'pub'; Pub.mount(bag, sub); }
}

  }
  const el = t.closest && t.closest('[data-act]');
  if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener('input', (e) => {
  const el = e.target, k = el.dataset && el.dataset.in;
  if (k && IN[k]) IN[k](el, e);
});
document.addEventListener('change', (e) => {
  const el = e.target, k = el.dataset && el.dataset.ch;
  if (k && CH[k]) CH[k](el, e);
});
document.addEventListener('submit', (e) => {
  const f = e.target, k = f.dataset && f.dataset.submit;
  if (k && SUB[k]) { e.preventDefault(); SUB[k](f, e); }
});
document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (e.key === 'Escape' && Overlay.stack.length) { e.preventDefault(); Overlay.tutup(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && t.getAttribute && t.getAttribute('role') === 'button' && t.dataset.act && !/^(BUTTON|A|INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) {
    e.preventDefault(); t.click(); return;
  }
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && Adm.s.lapisDetail && Overlay.atas() === Adm.s.lapisDetail && !/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) {
    const b = $$('#overlay-root .drawer-h [data-act="adm.nav"]')[e.key === 'ArrowRight' ? 1 : 0];
    if (b && !b.disabled) { e.preventDefault(); b.click(); }
  }
});
function cobaSegarkanTunda() {
  const f = document.activeElement;
  if (Adm.s.nilaiTunda && !(f && f.closest && f.closest('#adm-main') && /^(INPUT|TEXTAREA)$/.test(f.tagName)) && !document.querySelector('#adm-main details.ae-menu[open]')) Adm.segarkanTampilan();
}
document.addEventListener('focusout', (e) => {
  // pembaruan yang ditunda di tab Penilaian dijalankan setelah panitia selesai mengetik
  if (Adm.s.nilaiTunda && e.target.closest && e.target.closest('#adm-main')) setTimeout(cobaSegarkanTunda, 300);
});
document.addEventListener('toggle', (e) => {
  if (e.target.matches && e.target.matches('details[data-info]')) Pub.s.infoOpen = e.target.open;
}, true);
ACT['muat-ulang'] = () => location.reload();

function muatSkrip(src, integrity) {
  return new Promise((resolve, reject) => {
    const sc = document.createElement('script');
    sc.src = src;
    if (integrity) { sc.integrity = integrity; sc.crossOrigin = 'anonymous'; }
    const t = setTimeout(() => reject(new Error('timeout')), 15000);
    sc.onload = () => { clearTimeout(t); resolve(); };
    sc.onerror = () => { clearTimeout(t); reject(new Error('gagal')); };
    document.head.appendChild(sc);
  });
}
/* Link dari email Supabase (undangan / link masuk / lupa password) kembali dengan
   #access_token=…&refresh_token=… atau #error=… — dipasang sebagai sesi lalu diarahkan ke ruang panitia. */
async function tangkapLinkEmail() {
  const h = location.hash.replace(/^#\/?/, '');
  if (!/(^|&)(access_token|error)=/.test(h)) return;
  const q = new URLSearchParams(h);
  if (q.get('error')) {
    history.replaceState(null, '', '#panitia');
    const kadaluarsa = /expired|otp/i.test(q.get('error_code') || q.get('error_description') || '');
    setTimeout(() => toast(kadaluarsa ? 'Link email sudah kedaluwarsa atau sudah dipakai. Minta link masuk baru dari halaman login.' : 'Link email tidak bisa dipakai. Minta link masuk baru.', 'bad', 9000), 300);
    return;
  }
  try {
    if (api.pasangSesiDariLink) await api.pasangSesiDariLink(q.get('access_token'), q.get('refresh_token'));
    Pusat.s.dariLink = true;
    history.replaceState(null, '', '#panitia/sandi');
  } catch (e) {
    history.replaceState(null, '', '#panitia');
    setTimeout(() => toast(pesanError(e), 'bad', 8000), 300);
  }
}
async function mulai() {
  const perluSupabase = !CONFIG.MULTI_EVENT_DEMO && CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY;
  if (perluSupabase && !(window.supabase && window.supabase.createClient)) {
    const sumber = [
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js',
      'https://unpkg.com/@supabase/supabase-js@2.116.0/dist/umd/supabase.js',
    ];
    for (const src of sumber) {
      try { await muatSkrip(src, SRI_SUPABASE); break; } catch (e) { /* coba sumber berikutnya */ }
    }
  }
  try { api = buatApi(); }
  catch (e) {
    $('#app').innerHTML = `<div class="login-wrap"><div class="card login"><h2 class="h2">Halaman gagal dimuat</h2>
      <p class="lead">Komponen aplikasi tidak bisa diunduh. Periksa koneksi internet, lalu muat ulang halaman.</p>
      <button class="btn btn-primary btn-block" data-act="muat-ulang">${ico('refresh')} Muat ulang</button></div></div>`;
    return;
  }
  Pub.init();
  api.onAuth((ev, sesi) => Adm.onAuth(ev, sesi));
  await tangkapLinkEmail();
  window.addEventListener('hashchange', rute);
  rute();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mulai);
else mulai();
</script>
