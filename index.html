  /* ---------------- RINGKASAN ---------------- */
  vRingkasan() {
    const { st } = this.idx, d = this.s.data, ev = d.pengaturan;
    const kuotaTotal = d.seri.filter((x) => x.aktif).reduce((a, x) => a + x.kuota, 0);
    const terisiAktif = d.seri.filter((x) => x.aktif).reduce((a, x) => { const c = this.idx.perSeri.get(x.id); return a + c.menunggu + c.terkonfirmasi; }, 0);
    const sisa = Math.max(0, kuotaTotal - terisiAktif);
    const todo = [];
    const item = (kls, ikon, judul, sub, tombol) => `<div class="todo-item"><div class="ti ${kls}">${ico(ikon)}</div><div class="tt"><b>${judul}</b><span>${sub}</span></div>${tombol}</div>`;
    if (st.menunggu) todo.push(item('warn', 'clock', `${st.menunggu} pendaftaran menunggu verifikasi`, 'Cek bukti transfer, lalu konfirmasi atau tolak.', `<button class="btn btn-sm btn-primary" data-act="adm.verifikasi">Verifikasi ${ico('arrow-r')}</button>`));
    if (st.waBelum) todo.push(item('info', 'chat', `${st.waBelum} konfirmasi WhatsApp belum dikirim`, 'Sudah terkonfirmasi tapi peserta belum menerima pesan WA.', `<button class="btn btn-sm" data-act="adm.filterWa">Kirim</button>`));
    if (st.dupMenunggu) todo.push(item('bad', 'layers', `${st.dupMenunggu} pendaftaran memakai bukti transfer yang sama`, 'Pastikan nominal transfer cukup untuk semua layangan.', `<button class="btn btn-sm" data-act="adm.filterDup">Periksa</button>`));
    if (!ev.bank_no_rek) todo.push(item('bad', 'bank', 'Rekening panitia belum diisi', 'Peserta belum bisa melihat tujuan transfer.', `<a class="btn btn-sm" href="#admin/pengaturan">Isi</a>`));
    if (!d.hari.length) todo.push(item('bad', 'cal', 'Jadwal terbang belum dibuat', 'Peserta baru bisa mendaftar setelah ada hari, seri, dan grup di jadwal terbang.', `<a class="btn btn-sm" href="#admin/seri">Buat</a>`));
    const tanpaTgl = d.hari.filter((h) => !h.tanggal).length;
    if (tanpaTgl) todo.push(item('info', 'cal', `${tanpaTgl} hari belum punya tanggal`, 'Tanggal tampil di formulir dan pesan WA.', `<a class="btn btn-sm" href="#admin/seri">Atur</a>`));
    const kpi = (label, nilai, sub, opsi = {}) => {
      const tag = opsi.act ? 'button' : 'div';
      return `<${tag} class="kpi ${opsi.hi ? 'hi' : ''}" ${opsi.act ? `type="button" data-act="${opsi.act}"` : ''}><div class="l">${label}</div><div class="v">${nilai}</div><div class="s">${sub}</div></${tag}>`;
    };
    return `${this.vTopbar('Ringkasan', `${ev.nama_event || ''}`, `<button class="btn btn-sm" data-act="adm.tambah">${ico('plus')}<span>Tambah manual</span></button>`)}
      ${todo.length ? `<div class="todo">${todo.join('')}</div>` : `<div class="note good">${ico('check')}<span>Semua beres — tidak ada yang perlu ditindaklanjuti.</span></div>`}
      <div class="kpis">
        ${kpi('Menunggu verifikasi', angka(st.menunggu), st.menunggu ? 'Klik untuk mulai verifikasi' : 'Tidak ada antrean', { hi: st.menunggu > 0, act: st.menunggu ? 'adm.verifikasi' : '' })}
        ${kpi('Terkonfirmasi', angka(st.terkonfirmasi), `dari ${angka(st.menunggu + st.terkonfirmasi)} layangan terdaftar`)}
        ${kpi('Pemasukan terkonfirmasi', rupiahSingkat(st.uangOk), `${rupiah(st.uangTunggu)} masih menunggu verifikasi`)}
        ${kpi('Sisa kuota', angka(sisa), `dari ${angka(kuotaTotal)} kotak di ${d.seri.filter((x) => x.aktif).length} grup dibuka`)}
      </div>
      <div class="grid2">
        <div>${this.vKuota()}</div>
        <div>${this.vPerJenis()}<div class="panel">${this.vGrafik()}</div></div>
      </div>
      ${this.vPemasukan()}
      <div class="panel" style="margin-top:16px"><div class="panel-h"><h3>Pendaftaran terbaru</h3><a class="btn btn-sm" href="#admin/pendaftaran">Lihat semua ${ico('arrow-r')}</a></div>
        ${d.daftar.length ? `<div class="rows">${d.daftar.slice(0, 6).map((r) => this.vRow(r, 'baru')).join('')}</div>` : '<div class="empty">Belum ada pendaftaran. Bagikan link pendaftaran dari menu Pengaturan.</div>'}
      </div>`;
  },
  vMeter(c, kuota, lg) {
    const k = kuota || 0;
    const p1 = k ? Math.min(100, (c.terkonfirmasi / k) * 100) : 0;
    const p2 = k ? Math.min(100 - p1, (c.menunggu / k) * 100) : 0;
    return `<div class="meter ${lg ? 'lg' : ''}" role="img" aria-label="${c.terkonfirmasi} terkonfirmasi, ${c.menunggu} menunggu, kuota ${k}">${p1 > 0 ? `<i class="m1" style="width:${p1.toFixed(2)}%"></i>` : ''}${p2 > 0 ? `<i class="m2" style="width:${p2.toFixed(2)}%"></i>` : ''}</div>`;
  },
  vKuota() {
    const d = this.s.data;
    return `<div class="panel"><div class="panel-h"><h3>Kuota per grup</h3><div class="legend"><span><i style="background:var(--meter-1)"></i>Terkonfirmasi</span><span><i style="background:var(--meter-2)"></i>Menunggu</span></div></div>
      ${d.jenis.map((j) => {
        const list = d.seri.filter((x) => x.jenis === j.kode);
        if (!list.length) return '';
        return `<div class="q-group"><h4>${jdot(j.kode, d.jenis)}${esc(j.nama)}</h4>${list.map((x) => {
          const c = this.idx.perSeri.get(x.id), terisi = c.terkonfirmasi + c.menunggu, sisa = Math.max(0, x.kuota - terisi);
          const ket = !x.aktif ? ' · ditutup' : sisa === 0 ? ' · <b style="color:var(--bad-ink)">penuh</b>' : '';
          return `<div class="q-row"><div class="q-n">${esc(x.nama)}<small>${esc(jadwalText(x, true))}</small></div><div class="q-v"><b>${terisi}</b>/${x.kuota}${ket}</div>${this.vMeter(c, x.kuota)}</div>`;
        }).join('')}</div>`;
      }).join('') || '<div class="empty">Belum ada seri.</div>'}
    </div>`;
  },
  vPerJenis() {
    const d = this.s.data;
    let tot = { m: 0, k: 0, t: 0, u: 0 };
    const rows = d.jenis.map((j) => {
      const r = d.daftar.filter((x) => x.jenis === j.kode);
      const m = r.filter((x) => x.status === 'menunggu').length, k = r.filter((x) => x.status === 'terkonfirmasi'), t = r.filter((x) => x.status === 'ditolak').length;
      const u = k.reduce((a, x) => a + x.harga, 0);
      tot = { m: tot.m + m, k: tot.k + k.length, t: tot.t + t, u: tot.u + u };
      return `<tr><td><span class="jtag">${jdot(j.kode, d.jenis)}${esc(j.nama)}</span><div class="hint">${rupiah(j.harga)}</div></td><td class="r">${m}</td><td class="r">${k.length}</td><td class="r hide-sm">${t}</td><td class="r">${rupiah(u)}</td></tr>`;
    }).join('');
    return `<div class="panel"><div class="panel-h"><h3>Per jenis layangan</h3></div><div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Jenis</th><th class="r">Menunggu</th><th class="r">Konfirmasi</th><th class="r hide-sm">Ditolak</th><th class="r">Pemasukan</th></tr></thead>
      <tbody>${rows}</tbody><tfoot><tr><td>Total</td><td class="r">${tot.m}</td><td class="r">${tot.k}</td><td class="r hide-sm">${tot.t}</td><td class="r">${rupiah(tot.u)}</td></tr></tfoot></table></div></div>`;
  },
  /* Pemasukan dipisah menurut cara bayar: transfer (ada bukti) vs tunai (daftar manual panitia) */
  vPemasukan() {
    const d = this.s.data;
    const nol = () => ({ n: 0, rp: 0 });
    const tambah = (o, r) => { o.n++; o.rp += r.harga || 0; };
    const tot = { tf: nol(), cash: nol(), tfTunggu: nol(), cashTunggu: nol() };
    const baris = d.jenis.map((j) => {
      const b = { tf: nol(), cash: nol() };
      for (const r of d.daftar) {
        if (r.jenis !== j.kode) continue;
        const tunai = caraBayar(r) === 'tunai';
        if (r.status === 'terkonfirmasi') { tambah(tunai ? b.cash : b.tf, r); tambah(tunai ? tot.cash : tot.tf, r); }
        else if (r.status === 'menunggu') tambah(tunai ? tot.cashTunggu : tot.tfTunggu, r);
      }
      return { j, ...b };
    }).filter((x) => x.tf.n || x.cash.n);
    const sel = (o) => `<td class="r">${o.n ? `${rupiah(o.rp)}<div class="hint">${o.n} layangan</div>` : '<span class="muted">—</span>'}</td>`;
    const total = tot.tf.rp + tot.cash.rp;
    const pct = (x) => (total ? Math.round((x / total) * 100) : 0);
    return `<div class="panel" style="margin-top:16px"><div class="panel-h"><h3>Pemasukan per cara bayar</h3><span class="hint">Hanya pendaftaran terkonfirmasi</span></div>
      <div class="kpis kpis-3" style="margin-bottom:14px">
        <div class="kpi"><div class="l">${ico('bank')} Transfer</div><div class="v">${rupiahSingkat(tot.tf.rp)}</div><div class="s">${tot.tf.n} layangan · ${pct(tot.tf.rp)}%</div></div>
        <div class="kpi"><div class="l">${ico('wallet')} Tunai (daftar manual)</div><div class="v">${rupiahSingkat(tot.cash.rp)}</div><div class="s">${tot.cash.n} layangan · ${pct(tot.cash.rp)}%</div></div>
        <div class="kpi hi"><div class="l">Total pemasukan</div><div class="v">${rupiahSingkat(total)}</div><div class="s">${rupiah(total)}</div></div>
      </div>
      ${baris.length ? `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Jenis</th><th class="r">Transfer</th><th class="r">Tunai</th><th class="r">Total</th></tr></thead>
        <tbody>${baris.map((x) => `<tr><td><span class="jtag">${jdot(x.j.kode, d.jenis)}${esc(x.j.nama)}</span></td>${sel(x.tf)}${sel(x.cash)}<td class="r"><b>${rupiah(x.tf.rp + x.cash.rp)}</b><div class="hint">${x.tf.n + x.cash.n} layangan</div></td></tr>`).join('')}</tbody>
        <tfoot><tr><td>Total</td>${sel(tot.tf)}${sel(tot.cash)}<td class="r">${rupiah(total)}<div class="hint">${tot.tf.n + tot.cash.n} layangan</div></td></tr></tfoot>
      </table></div>` : '<div class="empty">Belum ada pemasukan terkonfirmasi.</div>'}
      ${tot.tfTunggu.n || tot.cashTunggu.n ? `<p class="hint" style="margin:12px 0 0">Belum dihitung (masih menunggu verifikasi): transfer ${rupiah(tot.tfTunggu.rp)} (${tot.tfTunggu.n})${tot.cashTunggu.n ? ` · tunai ${rupiah(tot.cashTunggu.rp)} (${tot.cashTunggu.n})` : ''}.</p>` : ''}
    </div>`;
  },
  vGrafik() {
    const HARI = 14, kini = bagianWaktu(new Date()), tHariIni = Date.UTC(kini.y, kini.m - 1, kini.d);
    const bins = Array.from({ length: HARI }, (_, i) => ({ d: new Date(tHariIni - (HARI - 1 - i) * 86400000), n: 0 }));
    const t0 = bins[0].d.getTime();
    for (const r of this.s.data.daftar) {
      const b = bagianWaktu(r.created_at);
      if (!b) continue;
      const i = Math.round((Date.UTC(b.y, b.m - 1, b.d) - t0) / 86400000);
      if (i >= 0 && i < HARI) bins[i].n++;
    }
    const maks = Math.max(0, ...bins.map((b) => b.n)), total = bins.reduce((a, b) => a + b.n, 0);
    const langkah = [1, 2, 3, 4, 5, 6, 8, 10, 12, 15, 20, 25, 30, 40, 50, 60, 80, 100, 125, 150, 200, 250, 300, 400, 500, 1000];
    const step = langkah.find((c) => c * 4 >= maks) || Math.ceil(maks / 4);
    const top = step * 4;
    const W = 600, H = 210, L = 34, R = 10, T = 16, B = 28, pw = W - L - R, ph = H - T - B, slot = pw / HARI, bw = Math.min(24, slot * 0.62);
    const y = (v) => T + ph - (v / top) * ph;
    let svg = '';
    for (let k = 0; k <= 4; k++) {
      const v = step * k, yy = y(v).toFixed(1);
      svg += `<line class="${k === 0 ? 'base' : 'gl'}" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text x="${L - 8}" y="${(+yy + 4).toFixed(1)}" text-anchor="end">${v}</text>`;
    }
    const iMaks = bins.findIndex((b) => b.n === maks && maks > 0);
    bins.forEach((b, i) => {
      const cx = L + slot * i + slot / 2, x0 = cx - bw / 2, yTop = y(b.n), h = T + ph - yTop;
      const label = `${HARI3[b.d.getUTCDay()]}, ${b.d.getUTCDate()} ${BLN[b.d.getUTCMonth()]}`;
      svg += `<rect class="hit" x="${(L + slot * i).toFixed(1)}" y="${T}" width="${slot.toFixed(1)}" height="${ph}" tabindex="0" role="img" aria-label="${label}: ${b.n} pendaftaran" data-n="${b.n}" data-t="${i === HARI - 1 ? 'Hari ini' : label}" data-x="${((cx / W) * 100).toFixed(2)}" data-y="${((Math.min(yTop, T + ph - 2) / H) * 100).toFixed(2)}"/>`;
      if (b.n > 0) {
        const r = Math.min(4, bw / 2, h);
        svg += `<path class="bar" d="M${x0.toFixed(1)} ${(T + ph).toFixed(1)}V${(yTop + r).toFixed(1)}a${r} ${r} 0 0 1 ${r} -${r}h${(bw - 2 * r).toFixed(1)}a${r} ${r} 0 0 1 ${r} ${r}V${(T + ph).toFixed(1)}z"/>`;
      } else {
        svg += '<path class="bar" d=""/>';
      }
      if ((i === iMaks || i === HARI - 1) && b.n > 0) svg += `<text class="val" x="${cx.toFixed(1)}" y="${(yTop - 5).toFixed(1)}" text-anchor="middle">${b.n}</text>`;
      if (i % 2 === 1 || i === HARI - 1) svg += `<text x="${cx.toFixed(1)}" y="${H - 8}" text-anchor="middle">${i === HARI - 1 ? 'Hari ini' : `${b.d.getUTCDate()}/${b.d.getUTCMonth() + 1}`}</text>`;
    });
    return `<div class="panel-h"><h3>Pendaftaran 14 hari terakhir</h3><span class="hint">${angka(total)} formulir masuk</span></div>
      <div class="chart" id="grafik-harian"><svg viewBox="0 0 ${W} ${H}" role="group" aria-label="Jumlah pendaftaran per hari, 14 hari terakhir">${svg}</svg><div class="tip" hidden></div></div>
      <details class="tbl-toggle"><summary>Lihat sebagai tabel</summary><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Tanggal</th><th class="r">Pendaftaran</th></tr></thead><tbody>
      ${bins.slice().reverse().map((b) => `<tr><td>${HARI3[b.d.getUTCDay()]}, ${b.d.getUTCDate()} ${BLN[b.d.getUTCMonth()]} ${b.d.getUTCFullYear()}</td><td class="r">${b.n}</td></tr>`).join('')}
      </tbody></table></div></details>`;
  },

  /* ---------------- PENDAFTARAN ---------------- */
  vPendaftaran() {
    return `${this.vTopbar('Pendaftaran', `${angka(this.idx.st.total)} layangan tercatat`,
      `<button class="btn btn-sm btn-primary" data-act="adm.tambah">${ico('plus')}<span>Tambah manual</span></button><button class="btn btn-sm" data-act="adm.ekspor">${ico('download')}<span>Excel</span></button>`)}
      <div class="filters">
        <div class="f-row"><div class="search">${ico('search')}<input id="adm-search" class="input input-sm" type="search" placeholder="Cari kode, sekha, alamat, WA, nomor layangan, nama rekening…" value="${esc(this.s.f.q)}" data-in="adm.q" autocomplete="off" aria-label="Cari pendaftaran"></div></div>
        <div id="adm-filters">${this.vFilter()}</div>
      </div>
      <div id="adm-list">${this.vList()}</div>`;
  },
  vFilter() {
    const f = this.s.f, st = this.idx.st, d = this.s.data;
    const seg = [['semua', 'Semua', st.total], ['menunggu', 'Menunggu', st.menunggu], ['terkonfirmasi', 'Terkonfirmasi', st.terkonfirmasi], ['ditolak', 'Ditolak', st.ditolak]];
    const seriOpsi = d.seri.filter((x) => !f.jenis || x.jenis === f.jenis);
    return `<div class="f-row"><div class="seg" role="group" aria-label="Filter status">${seg.map(([v, l, n]) => `<button type="button" class="${f.status === v ? 'on' : ''}" data-act="adm.fStatus" data-v="${v}" aria-pressed="${f.status === v}">${l} <small>${n}</small></button>`).join('')}</div></div>
      <div class="f-row gulir">
        <select class="input input-sm" style="width:auto" data-ch="adm.fJenis" aria-label="Filter jenis"><option value="">Semua jenis</option>${d.jenis.map((j) => `<option value="${esc(j.kode)}" ${f.jenis === j.kode ? 'selected' : ''}>${esc(j.nama)}</option>`).join('')}</select>
        <select class="input input-sm" style="width:auto;max-width:100%" data-ch="adm.fSeri" aria-label="Filter seri"><option value="">Semua seri</option>${seriOpsi.map((x) => `<option value="${x.id}" ${String(f.seri) === String(x.id) ? 'selected' : ''}>${esc(this.namaJenis(x.jenis))} · ${esc(x.nama)}</option>`).join('')}</select>
        <button type="button" class="tgl ${f.wa ? 'on' : ''}" data-act="adm.fWa" aria-pressed="${f.wa}">${ico('chat')} WA belum dikirim <small>${st.waBelum}</small></button>
        <button type="button" class="tgl ${f.dup ? 'on' : ''}" data-act="adm.fDup" aria-pressed="${f.dup}">${ico('layers')} Bukti dobel</button>
        <select class="input input-sm" style="width:auto" data-ch="adm.fUrut" aria-label="Urutan">${[['terbaru', 'Terbaru'], ['terlama', 'Terlama'], ['nomor', 'Nomor layangan'], ['sekha', 'Nama sekha'], ['seri', 'Seri']].map(([v, l]) => `<option value="${v}" ${f.urut === v ? 'selected' : ''}>Urut: ${l}</option>`).join('')}</select>
      </div>`;
  },
  hasilFilter() {
    const f = this.s.f, d = this.s.data;
    const q = f.q.trim().toLowerCase(), qAngka = q.replace(/\D/g, ''), qWA = normWA(q);
    const rows = d.daftar.filter((r) => {
      if (f.status !== 'semua' && r.status !== f.status) return false;
      if (f.jenis && r.jenis !== f.jenis) return false;
      if (f.seri && String(r.seri_id) !== String(f.seri)) return false;
      if (f.wa && !(r.status === 'terkonfirmasi' && !r.wa_terkirim_at)) return false;
      if (f.dup && !this.idx.dupIds.has(r.id)) return false;
      if (q) {
        const teks = `${r.kode} ${r.nama_sekha} ${r.alamat} ${r.nama_rekening} ${r.nomor_layangan || ''} ${r.catatan_admin || ''}`.toLowerCase();
        const cocokWA = (qWA && r.no_wa === qWA) || (qAngka.length >= 4 && qAngka.length === q.replace(/[\s+().-]/g, '').length && r.no_wa.includes(qAngka.replace(/^0/, '')));
        if (!teks.includes(q) && !cocokWA) return false;
      }
      return true;
    });
    const posSeri = new Map(d.seri.map((x, i) => [x.id, i])), posJenis = new Map(d.jenis.map((j, i) => [j.kode, i]));
    const byNomor = (a, b) => (a.nomor_urut || 1e9) - (b.nomor_urut || 1e9) || a.created_at.localeCompare(b.created_at);
    const urut = {
      terbaru: (a, b) => b.created_at.localeCompare(a.created_at),
      terlama: (a, b) => a.created_at.localeCompare(b.created_at),
      nomor: (a, b) => (posJenis.get(a.jenis) - posJenis.get(b.jenis)) || byNomor(a, b),
      sekha: (a, b) => a.nama_sekha.localeCompare(b.nama_sekha, 'id') || byNomor(a, b),
      seri: (a, b) => (posSeri.get(a.seri_id) - posSeri.get(b.seri_id)) || byNomor(a, b),
    }[f.urut] || (() => 0);
    return rows.sort(urut);
  },
  vList() {
    const rows = this.hasilFilter(), f = this.s.f, total = this.s.data.daftar.length;
    if (!this.s.detail) this.s.nav = rows.map((r) => r.id);
    const adaFilter = f.status !== 'semua' || f.jenis || f.seri || f.wa || f.dup || f.q.trim();
    const nTunggu = rows.filter((r) => r.status === 'menunggu').length;
    const info = `<div class="res-info"><span>Menampilkan <b>${rows.length}</b> dari ${total}</span>${adaFilter ? `<button class="btn btn-xs btn-ghost" data-act="adm.fReset">${ico('x')} Reset filter</button>` : ''}${nTunggu > 1 ? `<button class="btn btn-xs btn-ghost" data-act="adm.tolakMassal" style="${adaFilter ? 'margin-left:0' : ''}">${ico('layers')} Tolak massal…</button>` : ''}</div>`;
    if (!rows.length) return info + `<div class="rows"><div class="empty">${total ? 'Tidak ada pendaftaran yang cocok dengan filter.' : 'Belum ada pendaftaran masuk.'}</div></div>`;
    const tampil = rows.slice(0, this.s.batas);
    return info + `<div class="rows">
      <div class="row head" aria-hidden="true"><span>Status · kode</span><span>Sekha</span><span>Jenis</span><span>Seri</span><span>Nomor</span><span class="c-harga">Biaya</span><span></span></div>
      ${tampil.map((r) => this.vRow(r)).join('')}
    </div>${rows.length > tampil.length ? `<div class="actions"><button class="btn" data-act="adm.lebih">Tampilkan lebih banyak (${rows.length - tampil.length} lagi)</button></div>` : ''}`;
  },
  vRow(r, asal = 'daftar') {
    const x = this.idx.seri.get(r.seri_id), j = this.idx.jenis.get(r.jenis), dj = this.s.data.jenis;
    let wa = ['', '', ''];
    if (r.status === 'terkonfirmasi') wa = r.wa_terkirim_at ? ['sent', 'WA konfirmasi sudah dikirim', 'check'] : ['need', 'WA konfirmasi belum dikirim', 'chat'];
    else if (r.status === 'ditolak' && r.wa_terkirim_at) wa = ['sent', 'WA penolakan sudah dikirim', 'check'];
    const flags = [];
    if (this.idx.dupIds.has(r.id)) flags.push('<span class="flag">Bukti dobel</span>');
    if (!r.bukti_path) flags.push('<span class="flag info">Manual</span>');
    return `<div class="row" role="button" tabindex="0" data-act="adm.buka" data-id="${esc(r.id)}" data-asal="${asal}">
      <span class="c-st">${badgeStatus(r.status)}<span class="kd">${esc(r.kode)}</span></span>
      <span class="c-sekha"><b>${esc(r.nama_sekha)}</b><span>${esc(r.alamat)}</span>${flags.length ? `<span class="flags">${flags.join('')}</span>` : ''}</span>
      <span class="c-jenis"><span class="jtag">${jdot(r.jenis, dj)}${esc((j && j.nama) || r.jenis)}</span></span>
      <span class="c-seri">${esc((x && x.nama) || '-')}<span>${esc(relatif(r.created_at))}</span></span>
      <span class="c-no">${esc(r.nomor_layangan || '—')}</span>
      <span class="c-harga">${rupiah(r.harga)}</span>
      <span class="c-wa ${wa[0]}" title="${wa[1]}">${wa[2] ? ico(wa[2]) + `<span class="sr-only">${wa[1]}</span>` : ''}</span>
      <span class="c-meta"><span class="jtag">${jdot(r.jenis, dj)}${esc((j && j.nama) || r.jenis)}</span><span>· ${esc((x && x.nama) || '-')}</span><span>· ${rupiah(r.harga)}</span><span>· ${esc(relatif(r.created_at))}</span></span>
    </div>`;
  },

  /* ---------------- DETAIL (drawer) ---------------- */
  buka(id) {
    this.s.detail = id;
    if (!this.s.nav.includes(id)) this.s.nav = [id];
    this.renderDetail();
  },
  renderDetail(dariSegar = false) {
    const r = this.baris(this.s.detail);
    const lapisan = this.s.lapisDetail;
    if (!r) { if (lapisan) Overlay.tutup(lapisan); return; }
    if (dariSegar && lapisan) {
      const a = document.activeElement;
      if (a && lapisan.el.contains(a) && /^(TEXTAREA|INPUT)$/.test(a.tagName)) return;
      if (lapisan.versi === r.updated_at) return;
    }
    const html = this.vDetail(r);
    if (lapisan && lapisan.el.isConnected) {
      const aside = lapisan.el.querySelector('.drawer');
      const scroll = aside.querySelector('.drawer-b').scrollTop;
      const sama = lapisan.id === r.id;
      aside.innerHTML = html;
      if (sama) aside.querySelector('.drawer-b').scrollTop = scroll;
    } else {
      this.s.lapisDetail = Overlay.buka(`<div class="ovl" data-ovl-bg><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-judul">${html}</aside></div>`,
        { onClose: () => { this.s.detail = null; this.s.lapisDetail = null; } });
    }
    this.s.lapisDetail.versi = r.updated_at;
    this.s.lapisDetail.id = r.id;
    this.muatBukti(r);
  },
  vDetail(r) {
    const x = this.idx.seri.get(r.seri_id), j = this.idx.jenis.get(r.jenis), dj = this.s.data.jenis;
    const nav = this.s.nav, pos = nav.indexOf(r.id);
    const prev = pos > 0 ? nav[pos - 1] : null, next = pos >= 0 && pos < nav.length - 1 ? nav[pos + 1] : null;
    const dup = r.bukti_hash ? (this.idx.hash.get(r.bukti_hash) || []).filter((o) => o.id !== r.id) : [];
    const nWA = (this.idx.perWA.get(r.no_wa) || 1) - 1;
    const tombolNav = (id, ikon, label) => `<button class="btn btn-icon btn-sm" data-act="adm.nav" data-id="${esc(id || '')}" ${id ? '' : 'disabled'} aria-label="${label}">${ico(ikon)}</button>`;
    return `<div class="drawer-h">
        <button class="btn btn-icon btn-ghost" data-act="ovl.tutup" aria-label="Tutup">${ico('x')}</button>
        <div class="dt"><b id="dr-judul">${esc(r.nama_sekha)}</b><span>${esc(r.kode)} · ${esc(fmtWaktu(r.created_at))}</span></div>
        ${nav.length > 1 && pos >= 0 ? `<span class="hint num">${pos + 1}/${nav.length}</span>` : ''}
        ${tombolNav(prev, 'chev-l', 'Sebelumnya')}${tombolNav(next, 'chev-r', 'Berikutnya')}
      </div>
      <div class="drawer-b">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px">${badgeStatus(r.status)}<span class="badge b-off"><span class="jtag">${jdot(r.jenis, dj)}${esc((j && j.nama) || r.jenis)}</span></span><span class="badge b-off">${esc((x && x.nama) || '-')}</span>${!r.bukti_path ? '<span class="badge b-info">Manual</span>' : ''}</div>
        ${r.status !== 'ditolak' && r.nomor_layangan ? `<div class="big-no">${ico('kite')}<div><span>Nomor layangan${r.status === 'menunggu' ? ' (belum dikonfirmasi)' : ''}</span><br><b>${esc(r.nomor_layangan)}</b></div></div>` : ''}
        ${r.status === 'ditolak' ? `<div class="note bad">${ico('x')}<span><b>Ditolak:</b> ${esc(r.alasan_tolak || '-')}</span></div>` : ''}
        <div class="sect"><h4>Pembayaran</h4>
          <div class="total" style="margin:0 0 10px"><div><div class="t-l">Tagihan ${esc((j && j.nama) || '')}</div><div class="t-s">Pengirim: <b>${esc(r.nama_rekening)}</b></div></div><div class="amt">${rupiah(r.harga)}</div></div>
          ${dup.length ? `<div class="note warn">${ico('layers')}<span><b>Bukti transfer yang sama</b> juga dipakai ${dup.map((o) => `<a href="#" data-act="adm.nav" data-id="${esc(o.id)}">${esc(o.kode)}</a> (${esc(o.nama_sekha)}, ${rupiah(o.harga)}, ${STATUS[o.status].label.toLowerCase()})`).join(', ')}. Total gabungan <b>${rupiah(r.harga + dup.reduce((a, o) => a + o.harga, 0))}</b> — pastikan nominal transfer cukup.</span></div>` : ''}
          ${r.bukti_path ? `<div class="bukti-box" id="bukti-box"><div class="empty"><span class="spinner" style="margin:0 auto"></span></div></div><div class="bukti-tools" id="bukti-tools"></div>` : `<div class="empty-sm">${ico('file')} Tanpa bukti transfer — pendaftaran manual oleh panitia.</div>`}
        </div>
        <div class="sect"><h4>Data pendaftaran</h4>
          <dl class="kv">
            <dt>Jenis layangan</dt><dd>${esc((j && j.nama) || r.jenis)}</dd>
            <dt>Nama sekha</dt><dd>${esc(r.nama_sekha)}</dd>
            <dt>Alamat</dt><dd>${nl2br(r.alamat)}</dd>
            <dt>Nomor WA</dt><dd><a href="${esc(waLink(r.no_wa))}" target="_blank" rel="noopener">${esc(fmtWA(r.no_wa))}</a>${nWA > 0 ? ` <a href="#" class="hint" data-act="adm.cariWA" data-wa="${esc(r.no_wa)}">· ${nWA} pendaftaran lain</a>` : ''}</dd>
            <dt>Nomor layangan</dt><dd>${r.nomor_layangan ? `<b>${esc(r.nomor_layangan)}</b>` : '<span class="muted">Belum ada</span>'}</dd>
            <dt>Seri & grup</dt><dd>${esc(this.labelGrupAdm(x))}${r.kotak ? ` · kotak ${r.kotak}` : ''}<div class="sub">${esc(jadwalText(x))}</div></dd>
            <dt>Kode</dt><dd class="mono">${esc(r.kode)}</dd>
          </dl>
        </div>
        <div class="sect"><h4>Riwayat</h4><ul class="timeline">
          <li>${ico('edit')}<span>Didaftarkan <b>${esc(fmtWaktu(r.created_at))}</b></span></li>
          ${r.dikonfirmasi_at ? `<li>${ico('check')}<span>Dikonfirmasi <b>${esc(fmtWaktu(r.dikonfirmasi_at))}</b></span></li>` : ''}
          ${r.wa_terkirim_at ? `<li>${ico('chat')}<span>WA ${r.status === 'ditolak' ? 'penolakan' : 'konfirmasi'} dibuka <b>${esc(fmtWaktu(r.wa_terkirim_at))}</b></span></li>` : ''}
        </ul></div>
        <div class="sect"><h4>Catatan admin</h4>
          <textarea class="input" rows="2" id="catatan-admin" placeholder="Catatan internal, tidak terlihat peserta" aria-label="Catatan admin">${esc(r.catatan_admin || '')}</textarea>
          <div class="actions end" style="margin-top:8px"><button class="btn btn-sm" data-act="adm.simpanCatatan" data-id="${esc(r.id)}">Simpan catatan</button></div>
        </div>
        <div class="sect"><h4>Tindakan lain</h4><div class="sa-act">
          <button class="btn btn-sm" data-act="adm.edit" data-id="${esc(r.id)}">${ico('edit')} Ubah data</button>
          ${r.status === 'terkonfirmasi' ? `<button class="btn btn-sm" data-act="adm.batalKonfirmasi" data-id="${esc(r.id)}">${ico('undo')} Batalkan konfirmasi</button><button class="btn btn-sm" data-act="adm.tolak" data-id="${esc(r.id)}">${ico('x')} Tolak</button>` : ''}
          ${r.status === 'ditolak' ? `<button class="btn btn-sm" data-act="adm.pulihkan" data-id="${esc(r.id)}">${ico('undo')} Pulihkan ke menunggu</button>` : ''}
          ${r.status !== 'menunggu' ? `<button class="btn btn-sm" data-act="adm.salinWA" data-id="${esc(r.id)}">${ico('copy')} Salin teks WA</button>` : ''}
          <a class="btn btn-sm" href="${esc(waLink(r.no_wa))}" target="_blank" rel="noopener">${ico('chat')} Chat peserta</a>
          <button class="btn btn-sm btn-danger" data-act="adm.hapus" data-id="${esc(r.id)}">${ico('trash')} Hapus</button>
        </div></div>
      </div>
      ${this.vAksiDetail(r, next)}`;
  },
  vAksiDetail(r, next) {
    if (r.status === 'menunggu') {
      return `<div class="drawer-f"><button class="btn btn-danger" data-act="adm.tolak" data-id="${esc(r.id)}">${ico('x')} Tolak</button>
        <button class="btn btn-good" data-act="adm.konfirmasi" data-id="${esc(r.id)}">${ico('check')} Konfirmasi pembayaran</button></div>`;
    }
    const sudah = !!r.wa_terkirim_at;
    const label = r.status === 'terkonfirmasi' ? (sudah ? 'Kirim ulang WA konfirmasi' : 'Kirim WA konfirmasi') : (sudah ? 'Kirim ulang WA penolakan' : 'Kirim WA penolakan');
    return `<div class="drawer-f">
      <a class="btn ${sudah ? '' : r.status === 'terkonfirmasi' ? 'btn-good' : 'btn-primary'}" href="${esc(waLink(r.no_wa, this.pesanWA(r)))}" target="_blank" rel="noopener" data-act="adm.waTerkirim" data-id="${esc(r.id)}">${ico('chat')} ${label}</a>
      ${next ? `<button class="btn" data-act="adm.nav" data-id="${esc(next)}">Berikutnya ${ico('arrow-r')}</button>` : ''}
    </div>`;
  },
  pesanWA(r, tpl) {
    const ev = this.s.data.pengaturan;
    const t = tpl != null ? tpl : r.status === 'ditolak' ? (ev.template_wa_tolak || TEMPLATE_WA.tolak) : (ev.template_wa_konfirmasi || TEMPLATE_WA.konfirmasi);
    return isiTemplate(t, dataTemplate(r, this.idx.seri.get(r.seri_id), this.idx.jenis.get(r.jenis), ev));
  },
  async urlBukti(path) {
    const c = this.s.url[path];
    if (c && c.exp > Date.now()) return c.url;
    const url = await api.urlBukti(path);
    this.s.url[path] = { url, exp: Date.now() + 50 * 60000 };
    return url;
  },
  async muatBukti(r) {
    if (!r.bukti_path) return;
    try {
      const url = await this.urlBukti(r.bukti_path);
      const box = $('#bukti-box'), tools = $('#bukti-tools');
      if (!box || this.s.detail !== r.id) return;
      const pdf = /\.pdf$/i.test(r.bukti_path);
      box.innerHTML = pdf
        ? `<div class="empty">${ico('file')}<div style="margin-top:6px">Bukti transfer berupa PDF</div></div>`
        : `<img src="${esc(url)}" alt="Bukti transfer ${esc(r.kode)}" data-act="adm.zoom" data-url="${esc(url)}">`;
      tools.innerHTML = pdf
        ? `<a class="btn btn-sm" href="${esc(url)}" target="_blank" rel="noopener">${ico('ext')} Buka PDF</a>`
        : `<button class="btn btn-sm" data-act="adm.zoom" data-url="${esc(url)}">${ico('eye')} Perbesar</button><a class="btn btn-sm" href="${esc(url)}" target="_blank" rel="noopener">${ico('ext')} Tab baru</a>`;
    } catch (e) {
      const box = $('#bukti-box');
      if (box && this.s.detail === r.id) box.innerHTML = `<div class="empty">${ico('alert')} ${esc(pesanError(e))}</div>`;
    }
  },

  /* ---------------- aksi data ---------------- */
  async ubah(id, patch, pesanOk, cekVersi = true) {
    const r = this.baris(id);
    try {
      const baru = await api.ubahPendaftaran(id, patch, cekVersi && r ? r.updated_at : null);
      this.gantiBaris(baru);
      if (pesanOk) toast(typeof pesanOk === 'function' ? pesanOk(baru) : pesanOk, 'good');
      return baru;
    } catch (e) {
      if (/DATA_BERUBAH/.test(e.message || '')) { this.tandaiUbah(); await this.muat({ diam: true }); }
      throw e;
    }
  },
  formTolak(r) {
    Overlay.modal(`<form data-submit="adm.tolak" data-id="${esc(r.id)}" novalidate>
      <h3>Tolak pendaftaran?</h3>
      <p class="lead">${esc(r.nama_sekha)} · ${esc(r.kode)}. Kotak di ${esc((this.idx.seri.get(r.seri_id) || {}).nama || 'grup')} dan nomor layangannya dilepas untuk peserta lain.</p>
      <div class="chips">${ALASAN_TOLAK.map((a) => `<button type="button" data-act="adm.pilihAlasan" data-v="${esc(a)}">${esc(a)}</button>`).join('')}</div>
      <div class="field"><label class="label" for="alasan">Alasan (ikut dikirim ke peserta)</label><textarea class="input" id="alasan" name="alasan" rows="3" maxlength="300">${esc(r.alasan_tolak || '')}</textarea></div>
      <div class="actions end"><button type="button" class="btn" data-act="ovl.tutup">Batal</button><button type="submit" class="btn btn-danger-solid">${ico('x')} Tolak pendaftaran</button></div>
    </form>`);
  },
  opsiSeri(jenis, pilih, idAbaikan) {
    const d = this.s.data;
    return d.seri.filter((x) => x.jenis === jenis && (x.sesi_id || String(x.id) === String(pilih) || this.idx.perSeri.get(x.id).menunggu + this.idx.perSeri.get(x.id).terkonfirmasi > 0)).map((x) => {
      const c = this.idx.perSeri.get(x.id), terisi = c.menunggu + c.terkonfirmasi, sisa = x.kuota - terisi;
      const saatIni = String(x.id) === String(pilih);
      const penuh = sisa <= 0 && !saatIni;
      return `<option value="${x.id}" ${saatIni ? 'selected' : ''} ${penuh ? 'disabled' : ''}>${esc(this.labelGrupAdm(x))} — ${esc(jadwalText(x, true))} (${saatIni ? 'saat ini' : penuh ? 'penuh' : `sisa ${sisa}`})${x.aktif ? '' : ' · ditutup'}${x.sesi_id ? '' : ' · seri lama'}</option>`;
    }).join('') || '<option value="">Belum ada grup untuk jenis ini di jadwal terbang</option>';
  },
  formPendaftaran(r) {
    const d = this.s.data, edit = !!r;
    const v = r || { jenis: (d.jenis.find((j) => j.aktif) || d.jenis[0] || {}).kode, seri_id: '', nama_sekha: '', alamat: '', no_wa: '', nama_rekening: 'Tunai (bayar langsung)', status: 'terkonfirmasi', catatan_admin: '' };
    Overlay.modal(`<form data-submit="adm.simpanPendaftaran" data-id="${esc((r && r.id) || '')}" novalidate>
      <h3>${edit ? 'Ubah data pendaftaran' : 'Tambah pendaftaran manual'}</h3>
      <p class="lead">${edit ? `${esc(r.kode)} · ${badgeStatus(r.status)}` : 'Untuk peserta yang mendaftar & membayar langsung ke panitia. Kuota grup dan nomor layangan tetap dicek.'}</p>
      <div class="g2">
        <div class="field"><label class="label" for="m-jenis">Jenis layangan</label><select class="input" id="m-jenis" name="jenis" data-ch="adm.mJenis">${d.jenis.map((j) => `<option value="${esc(j.kode)}" ${v.jenis === j.kode ? 'selected' : ''}>${esc(j.nama)} (${rupiah(j.harga)})</option>`).join('')}</select></div>
        <div class="field"><label class="label" for="m-seri">Seri & grup</label><select class="input" id="m-seri" name="seri_id">${this.opsiSeri(v.jenis, v.seri_id)}</select></div>
      </div>
      ${edit ? '<div class="note warn" id="m-jenis-warn" hidden>' + ico('alert') + '<span>Mengganti jenis akan mengubah tagihan sesuai harga jenis baru. Nomor layangan harus tetap unik di jenis baru.</span></div>' : ''}
      ${fieldInput({ id: 'm-nomor', name: 'nomor_layangan', label: 'Nomor layangan', value: v.nomor_layangan || '', maxlength: 6, inputmode: 'numeric', hint: 'Angka saja. Tidak boleh sama dengan peserta lain di jenis yang sama.' })}
      ${fieldInput({ id: 'm-sekha', name: 'nama_sekha', label: 'Nama sekha', value: v.nama_sekha, maxlength: 120 })}
      ${fieldInput({ id: 'm-alamat', name: 'alamat', label: 'Alamat', value: v.alamat, maxlength: 300, textarea: true, rows: 2 })}
      <div class="g2">
        ${fieldInput({ id: 'm-wa', name: 'no_wa', label: 'Nomor WhatsApp', value: v.no_wa ? fmtWA(v.no_wa) : '', type: 'tel', inputmode: 'tel', maxlength: 20, placeholder: '08xx-xxxx-xxxx' })}
        ${fieldInput({ id: 'm-rek', name: 'nama_rekening', label: 'Nama pemilik rekening', value: v.nama_rekening, maxlength: 120 })}
      </div>
      ${!edit ? `<div class="field"><span class="label">Status</span>
        <label class="check" style="margin:0"><input type="radio" name="status" value="terkonfirmasi" checked><span><b>Sudah bayar</b> — langsung terkonfirmasi</span></label>
        <label class="check" style="margin:0"><input type="radio" name="status" value="menunggu"><span><b>Belum bayar / perlu dicek</b> — masuk antrean verifikasi</span></label></div>` : ''}
      ${fieldInput({ id: 'm-catatan', name: 'catatan_admin', label: 'Catatan admin', value: v.catatan_admin || '', maxlength: 300, opsional: true })}
      <div class="actions end"><button type="button" class="btn" data-act="ovl.tutup">Batal</button><button type="submit" class="btn btn-primary">${edit ? 'Simpan perubahan' : `${ico('plus')} Tambahkan`}</button></div>
    </form>`);
  },
  formTolakMassal() {
    const rows = this.hasilFilter().filter((r) => r.status === 'menunggu');
    if (!rows.length) { toast('Tidak ada pendaftaran "menunggu" di hasil filter ini.', 'info'); return; }
    Overlay.modal(`<form data-submit="adm.tolakMassal" novalidate>
      <h3>Tolak massal</h3>
      <p class="lead">Untuk membersihkan pendaftaran palsu, dobel, atau yang tidak membayar. Centang yang akan ditolak — ${rows.length} pendaftaran menunggu sesuai filter saat ini.</p>
      <label class="check" style="margin:0 0 8px"><input type="checkbox" data-ch="adm.pilihSemua"><span><b>Pilih semua</b></span></label>
      <div class="massal-list">${rows.map((r) => `<label class="massal-item"><input type="checkbox" name="pilih" value="${esc(r.id)}"><span><b>${esc(r.nama_sekha)}</b> · <span class="mono">${esc(r.kode)}</span><br><small>${esc(fmtWA(r.no_wa))} · ${esc(this.namaJenis(r.jenis))} · ${esc(relatif(r.created_at))}${this.idx.dupIds.has(r.id) ? ' · bukti dobel' : ''}</small></span></label>`).join('')}</div>
      <div class="field" style="margin-top:14px"><label class="label" for="alasan-massal">Alasan penolakan</label><input class="input" id="alasan-massal" name="alasan" value="Pendaftaran tidak valid" maxlength="300"></div>
      <div class="actions end"><button type="button" class="btn" data-act="ovl.tutup">Batal</button><button type="submit" class="btn btn-danger-solid">${ico('x')} Tolak yang dipilih</button></div>
    </form>`);
  },
  mulaiVerifikasi() {
    this.s.f = { ...FILTER_AWAL, status: 'menunggu', urut: 'terlama' };
    this.s.batas = 150;
    this.s.bukaPertama = true;
    if (location.hash !== '#admin/pendaftaran') location.hash = '#admin/pendaftaran';
    else { this.segarkanTampilan(); this.bukaPertamaBila(); }
  },
  bukaPertamaBila() {
    if (!this.s.bukaPertama) return;
    this.s.bukaPertama = false;

    });

      const XLSX = await muatSheetJS();
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.json_to_sheet(data);
      ws['!cols'] = Object.keys(data[0]).map((k) => ({ wch: Math.min(40, Math.max(k.length + 2, ...data.slice(0, 200).map((o) => String(o[k]).length + 1))) }));
      XLSX.utils.book_append_sheet(wb, ws, 'Pendaftaran');
      const ws2 = XLSX.utils.json_to_sheet(rekap);
      ws2['!cols'] = Object.keys(rekap[0] || { a: 1 }).map(() => ({ wch: 16 }));
      XLSX.utils.book_append_sheet(wb, ws2, 'Rekap grup');
      const ok = d.daftar.filter((r) => r.status === 'terkonfirmasi');
      const uang = d.jenis.map((j) => {
        const rows = ok.filter((r) => r.jenis === j.kode), tf = rows.filter((r) => caraBayar(r) === 'transfer'), cs = rows.filter((r) => caraBayar(r) === 'tunai');
        const jml = (a) => a.reduce((t, r) => t + (r.harga || 0), 0);
        return { 'Jenis': j.nama, 'Transfer (layangan)': tf.length, 'Transfer (Rp)': jml(tf), 'Tunai (layangan)': cs.length, 'Tunai (Rp)': jml(cs), 'Total (Rp)': jml(rows) };
      }).filter((x) => x['Total (Rp)'] || x['Transfer (layangan)'] || x['Tunai (layangan)']);
      if (uang.length) {
        const sum = (k) => uang.reduce((t, x) => t + x[k], 0);
        uang.push({ 'Jenis': 'TOTAL', 'Transfer (layangan)': sum('Transfer (layangan)'), 'Transfer (Rp)': sum('Transfer (Rp)'), 'Tunai (layangan)': sum('Tunai (layangan)'), 'Tunai (Rp)': sum('Tunai (Rp)'), 'Total (Rp)': sum('Total (Rp)') });
        const ws3 = XLSX.utils.json_to_sheet(uang);
        ws3['!cols'] = Object.keys(uang[0]).map(() => ({ wch: 18 }));
        XLSX.utils.book_append_sheet(wb, ws3, 'Pemasukan');
      }
      XLSX.writeFile(wb, nama + '.xlsx');
      toast(`${data.length} baris diekspor ke Excel`, 'good');
    } catch (e) {
      unduhCSV(data, nama + '.csv');
      toast('Excel tidak bisa dimuat, diunduh sebagai CSV.', 'info', 5000);

  },

const SRI_XLSX = 'sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw';
async function muatSheetJS() {
  if (window.XLSX) return window.XLSX;
  for (const src of ['https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js', 'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js']) {
    try { await muatSkrip(src, SRI_XLSX); if (window.XLSX) return window.XLSX; } catch (e) { /* coba sumber berikutnya */ }
  }
  throw new Error('XLSX gagal dimuat');
}
function unduhCSV(rows, nama) {
  const kolom = Object.keys(rows[0] || {});
  const sel = (v) => {
    let s = String(v ?? '');
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const csv = '﻿' + [kolom.map(sel).join(','), ...rows.map((r) => kolom.map((k) => sel(r[k])).join(','))].join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = nama; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
async function sibuk(el, fn) {
  if (!el || el.disabled) return;
  const asli = el.innerHTML;
  el.disabled = true;
  el.innerHTML = '<span class="spinner"></span>' + (el.classList.contains('btn-icon') ? '' : ' Memproses…');
  try { return await fn(); }
  finally { if (el.isConnected) { el.disabled = false; el.innerHTML = asli; } }
}

/* jenis layangan */
const slugJenis = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 30);
function awalanJenis(nama, terpakai) {
  const huruf = String(nama || '').toUpperCase().replace(/[^A-Z0-9 ]/g, '').trim();
  if (!huruf) return 'J';
  const kata = huruf.split(/\s+/);
  const kandidat = [kata.length > 1 ? kata.map((k) => k[0]).join('').slice(0, 3) : '', (huruf.replace(/\s+/g, '')[0] || '') + (huruf.replace(/[\sAIUEO]/g, '').slice(1, 2) || huruf.replace(/\s+/g, '')[1] || ''), huruf.replace(/\s+/g, '').slice(0, 3)].filter(Boolean);
  for (const k of kandidat) if (!terpakai.has(k)) return k;
  const dasar = kandidat[0].slice(0, 3);
  for (let i = 2; i < 100; i++) if (!terpakai.has(dasar + i)) return (dasar + i).slice(0, 5);
  return dasar;
}

SUB['adm.simpanGrup'] = async (form) => {
  const id = Number(form.dataset.id) || null, sesi_id = Number(form.dataset.sesi), lama = id ? Adm.idx.seri.get(id) : null, d = Adm.s.data;
  const v = (n) => String(form[n].value).trim();
  const namaJenis = form.jenis.disabled ? null : v('jenis');
  const isi = { huruf: v('huruf').toUpperCase(), kotak: parseInt(v('kotak'), 10), catatan: v('catatan'), aktif: form.aktif.checked };
  if (!form.jenis.disabled && !namaJenis) return toast('Isi jenis layangan.', 'bad');
  if (!/^[A-Z0-9]{1,3}$/.test(isi.huruf)) return toast('Grup diisi huruf, misalnya A atau B.', 'bad');
  if (!Number.isInteger(isi.kotak) || isi.kotak < 1 || isi.kotak > 200) return toast('Jumlah kotak harus 1–200.', 'bad');
  if (d.seri.some((g) => g.sesi_id === sesi_id && g.id !== id && g.huruf === isi.huruf)) return toast(`Grup ${isi.huruf} sudah ada di seri ini.`, 'bad');
  let jenis = namaJenis ? cariJenisNama(namaJenis) : null;
  let hargaBaru = null;
  if (namaJenis && !jenis) {
    hargaBaru = v('harga') === '' ? NaN : Number(v('harga'));
    if (!Number.isInteger(hargaBaru) || hargaBaru < 0) { const w = $('#g-harga-wrap'); if (w) w.hidden = false; $('#g-harga') && $('#g-harga').focus(); return toast(`Isi harga untuk jenis baru "${namaJenis}".`, 'bad'); }
  }
  if (lama) {
    const c = Adm.idx.kotak.get(lama.id) || new Map();
    const lewat = [...c.keys()].filter((k) => k > isi.kotak);
    if (lewat.length) return toast(`Kotak ${lewat.join(', ')} sudah terisi. Jumlah kotak minimal ${Math.max(...c.keys())}.`, 'bad', 6000);
  }
  await sibuk(form.querySelector('[type=submit]'), async () => {
    try {
      if (namaJenis && !jenis) {
        let kode = slugJenis(namaJenis) || 'jenis';
        for (let i = 2; d.jenis.some((j) => j.kode === kode); i++) kode = (slugJenis(namaJenis) || 'jenis').slice(0, 26) + '-' + i;
        jenis = await api.tambahJenis({ kode, nama: namaJenis, harga: hargaBaru, prefix: awalanJenis(namaJenis, new Set(d.jenis.map((j) => j.prefix))), urutan: d.jenis.reduce((m, x) => Math.max(m, x.urutan || 0), 0) + 1, aktif: true });
        d.jenis.push(jenis);
        Adm.tandaiUbah(); Adm.indeks();
      }
      const data = { ...isi, sesi_id };
      if (jenis) data.jenis = jenis.kode;
      if (!lama) { data.tutup = []; data.urutan = d.seri.filter((g) => g.sesi_id === sesi_id).length + 1; data.nama = 'Grup ' + isi.huruf; }
      const hasil = await api.simpanSeri(lama ? { id: lama.id, ...data } : data);
      Adm.tandaiUbah();
      const i = d.seri.findIndex((g) => g.id === hasil.id);
      if (i >= 0) d.seri[i] = hasil; else d.seri.push(hasil);
      Adm.indeks(); Overlay.tutupYangBerisi(form); Adm.segarkanTampilan();
      toast(lama ? `Grup ${hasil.huruf} diperbarui` : `Grup ${hasil.huruf} · ${Adm.namaJenis(hasil.jenis)} ditambahkan`, 'good');
    } catch (e) { toast(pesanError(e), 'bad', 6000); }
  });
};

CH['adm.media'] = async (el) => {
  const file = el.files && el.files[0], k = el.dataset.k;
  el.value = '';
  if (!file) return;
  if (!/^image\/(png|jpeg|webp)$/.test(file.type)) return toast(pesanError(new Error('MEDIA_TIDAK_VALID')), 'bad');
  const ev = Adm.s.data.pengaturan, lama = ev[k + '_url'] || '';
  const tombol = el.closest('label');
  if (tombol) { tombol.insertAdjacentHTML('afterbegin', '<span class="spinner"></span>'); tombol.style.pointerEvents = 'none'; tombol.setAttribute('aria-busy', 'true'); }
  try {
    const png = k === 'logo' && file.type !== 'image/jpeg';
    const blob = await kompresGambar(file, k === 'logo' ? 512 : 1920, 0.82, png ? 'image/png' : 'image/jpeg');
    const url = await api.uploadMedia(k, blob, blob.type || (png ? 'image/png' : 'image/jpeg'));
    const hasil = await api.simpanPengaturan({ [k + '_url']: url });
    Object.assign(ev, hasil); Adm.tandaiUbah();
    if (lama && lama !== url) api.hapusMedia(lama);
    Adm.segarkanTampilan();
    toast(k === 'logo' ? 'Logo diperbarui' : 'Gambar latar diperbarui', 'good');
  } catch (e) { toast(pesanError(e), 'bad', 6000); }
  finally { if (tombol && tombol.isConnected) { const sp = tombol.querySelector('.spinner'); if (sp) sp.remove(); tombol.style.pointerEvents = ''; tombol.removeAttribute('aria-busy'); } }
};

};

  const btn = form.querySelector('[type=submit]');

    try {
      const hasil = await api.simpanPengaturan(patch);
      Adm.tandaiUbah();
      Object.assign(Adm.s.data.pengaturan, hasil);
      const side = $('#adm-side'); if (side) side.outerHTML = Adm.vSide();
      Adm.judulTab();
      toast(pesan, 'good');
    } catch (e) { toast(pesanError(e), 'bad', 6000); }
  });
}

SUB['adm.tolakMassal'] = async (form) => {
  const ids = $$('input[name="pilih"]:checked', form).map((i) => i.value);
  if (!ids.length) { toast('Belum ada yang dipilih.', 'bad'); return; }
  const alasan = form.alasan.value.trim() || 'Pendaftaran tidak valid';
  if (!(await konfirmasiDialog({ judul: `Tolak ${ids.length} pendaftaran?`, isi: 'Slot seri mereka langsung dilepas. Pesan WA penolakan tidak terkirim otomatis — kirim dari detail masing-masing bila perlu.', tombol: `Tolak ${ids.length}`, bahaya: true }))) return;
  const btn = form.querySelector('[type=submit]');
  await sibuk(btn, async () => {
    let ok = 0, gagal = 0;
    for (const id of ids) {
      try { await api.ubahPendaftaran(id, { status: 'ditolak', alasan_tolak: alasan }); ok++; } catch (e) { gagal++; }
    }
    Adm.tandaiUbah();
    Overlay.tutupYangBerisi(form);
    await Adm.muat({ diam: true });
    toast(`${ok} pendaftaran ditolak${gagal ? `, ${gagal} gagal` : ''}`, gagal ? 'bad' : 'good', 5000);
  });
};
/* =====================================================================
   7) ROUTER, EVENT GLOBAL & START
   ===================================================================== */
function rute() {
  let h = location.hash.replace(/^#\/?/, '');
  try { h = decodeURIComponent(h); } catch (e) { /* hash rusak: pakai apa adanya */ }
  const [bag, sub] = h.split('/');
  Overlay.tutupSemua();
  if (bag === 'admin') { Router.aktif = 'adm'; Adm.mount(sub); }
  else { Router.aktif = 'pub'; Pub.mount(bag); }
}

let targetTekan = null;
document.addEventListener('pointerdown', (e) => { targetTekan = e.target; }, true);
document.addEventListener('click', (e) => {
  const t = e.target;
  if (t.matches && t.matches('[data-ovl-bg]')) {
    if (targetTekan === t) Overlay.tutup();
    return;
  }
  const el = t.closest && t.closest('[data-act]');
  if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener('input', (e) => {
  const el = e.target, k = el.dataset && el.dataset.in;
  if (k && IN[k]) IN[k](el, e);
});
document.addEventListener('change', (e) => {
  const el = e.target, k = el.dataset && el.dataset.ch;
  if (k && CH[k]) CH[k](el, e);
});
document.addEventListener('submit', (e) => {
  const f = e.target, k = f.dataset && f.dataset.submit;
  if (k && SUB[k]) { e.preventDefault(); SUB[k](f, e); }
});
document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (e.key === 'Escape' && Overlay.stack.length) { e.preventDefault(); Overlay.tutup(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && t.getAttribute && t.getAttribute('role') === 'button' && t.dataset.act && !/^(BUTTON|A|INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) {
    e.preventDefault(); t.click(); return;
  }
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && Adm.s.lapisDetail && Overlay.atas() === Adm.s.lapisDetail && !/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) {
    const b = $$('#overlay-root .drawer-h [data-act="adm.nav"]')[e.key === 'ArrowRight' ? 1 : 0];
    if (b && !b.disabled) { e.preventDefault(); b.click(); }
  }
});
document.addEventListener('toggle', (e) => {
  if (e.target.matches && e.target.matches('details[data-info]')) Pub.s.infoOpen = e.target.open;
}, true);
ACT['muat-ulang'] = () => location.reload();

function muatSkrip(src, integrity) {
  return new Promise((resolve, reject) => {
    const sc = document.createElement('script');
    sc.src = src;
    if (integrity) { sc.integrity = integrity; sc.crossOrigin = 'anonymous'; }
    const t = setTimeout(() => reject(new Error('timeout')), 15000);
    sc.onload = () => { clearTimeout(t); resolve(); };
    sc.onerror = () => { clearTimeout(t); reject(new Error('gagal')); };
    document.head.appendChild(sc);
  });
}
async function mulai() {
  const perluSupabase = CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY;
  if (perluSupabase && !(window.supabase && window.supabase.createClient)) {
    const sumber = [
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js',
      'https://unpkg.com/@supabase/supabase-js@2.116.0/dist/umd/supabase.js',
    ];
    for (const src of sumber) {
      try { await muatSkrip(src, SRI_SUPABASE); break; } catch (e) { /* coba sumber berikutnya */ }
    }
  }
  try { api = buatApi(); }
  catch (e) {
    $('#app').innerHTML = `<div class="login-wrap"><div class="card login"><h2 class="h2">Halaman gagal dimuat</h2>
      <p class="lead">Komponen aplikasi tidak bisa diunduh. Periksa koneksi internet, lalu muat ulang halaman.</p>
      <button class="btn btn-primary btn-block" data-act="muat-ulang">${ico('refresh')} Muat ulang</button></div></div>`;
    return;
  }
  Pub.init();
  api.onAuth((ev, sesi) => Adm.onAuth(ev, sesi));
  window.addEventListener('hashchange', rute);
  rute();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mulai);
else mulai();
