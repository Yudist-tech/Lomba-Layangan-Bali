  }, 400),
  async segarkan() {
    try { this.s.info = await api.infoPublik(); this.s.err = null; this.rapikanPilihan(); } catch (e) { /* biarkan data lama */ }
  },
  async muat() {
    this.s.loading = true;
    this.render();
    try { this.s.info = await api.infoPublik(); this.s.err = null; }
    catch (e) { this.s.err = pesanError(e); }
    this.s.loading = false;
    this.rapikanPilihan();
    const ev = this.s.info && this.s.info.event;
    if (ev && ev.nama_event) document.title = `Pendaftaran ${ev.nama_event}`;
    this.renderAman();
  },
  /* ---------------- juara (publik) ---------------- */
  async muatJuara() {
    const slug = Ev.slug;
    try { const j = await api.juaraPublik(); this.s.juara = { slug, ...j }; }
    catch (e) { this.s.juara = { slug, diumumkan: false, list: [], gagal: true }; }
    if (Router.aktif === 'pub') this.renderAman();
  },
  juaraKini() { return this.s.juara && this.s.juara.slug === Ev.slug ? this.s.juara : null; },
  /* tab Juara muncul mulai hari terakhir event, atau begitu juara diumumkan */
  tabJuara() {
    const ev = (this.s.info && this.s.info.event) || {}, j = this.juaraKini();
    const akhir = ev.tanggal_selesai || ev.tanggal_mulai;
    return !!(j && j.diumumkan) || (!!akhir && akhir <= hariIniIso());
  },
  vJuara() {
    const info = this.s.info, ev = info.event, j = this.juaraKini();
    if (!j) return this.vKerangka();
    if (!j.diumumkan) {
      return `<section class="card juara-tunggu"><div class="jt-ico">${ico('trophy')}</div>
        <h2 class="h2">Juara segera diumumkan</h2>
        <p class="lead">Juri &amp; panitia sedang berdiskusi menentukan para juara ${esc(ev.nama_event || '')}. Pengumuman akan tampil di halaman ini, biasanya sore hari di hari terakhir lomba.</p>
        <button type="button" class="btn" data-act="pub.juaraMuat">${ico('refresh')} Muat ulang</button></section>`;
    }
    const nama = (k) => ((info.jenis || []).find((x) => x.kode === k) || {}).nama || k;
    // jenis yang sudah diumumkan (per jenis); jenis lain tampil "segera diumumkan"
    const sudah = new Set((j.jenis && j.jenis.length ? j.jenis.map((x) => x.jenis) : j.list.map((x) => x.jenis)));
    const urutJenis = (info.jenis || []).map((x) => x.kode).concat([...sudah].filter((k) => !(info.jenis || []).some((x) => x.kode === k)));
    if (!urutJenis.includes(this.s.juaraJenis)) this.s.juaraJenis = urutJenis.find((k) => sudah.has(k)) || urutJenis[0];
    const jk = this.s.juaraJenis, rows = j.list.filter((x) => x.jenis === jk);
    const chips = `<div class="nchips juara-jenis" role="tablist">${urutJenis.map((k) => `<button type="button" class="nchip ${k === jk ? 'on' : ''} ${sudah.has(k) ? '' : 'blm'}" data-act="pub.juaraJenis" data-v="${esc(k)}">${jdot(k, info.jenis)}${esc(nama(k))}${sudah.has(k) ? '' : ' <small>segera</small>'}</button>`).join('')}</div>`;
    const kepala = `<div class="juara-h"><span>${ico('trophy')} Pengumuman juara</span><h2 class="h2">${esc(ev.nama_event || '')}</h2></div>`;
    if (!sudah.has(jk)) {
      return `<section class="card">${kepala}${chips}
        <div class="juara-tunggu kecil"><div class="jt-ico">${ico('trophy')}</div>
          <h3>Juara ${esc(nama(jk))} segera diumumkan</h3>
          <p class="lead">Juri &amp; panitia masih berdiskusi untuk jenis ini. Juara jenis lain yang sudah diumumkan bisa dilihat di pilihan di atas.</p>
          <button type="button" class="btn" data-act="pub.juaraMuat">${ico('refresh')} Muat ulang</button></div>
      </section>`;
    }
    const foto = (x, kecil) => { const u = urlGambarAman(x.foto); return u ? `<button type="button" class="jw-foto${kecil ? ' kecil' : ''}" data-act="lp.flyer" data-url="${esc(u)}" data-judul="No. ${esc(x.nomor || '-')} · ${esc(x.sekha)}" aria-label="Lihat foto layangan No. ${esc(x.nomor || '-')}"><img src="${esc(u)}" alt="" loading="lazy"></button>` : ''; };
    const juara = rows.filter((x) => x.kelas === 'juara').sort((a, b) => a.urutan - b.urutan);
    const harapan = rows.filter((x) => x.kelas === 'harapan').sort((a, b) => a.urutan - b.urutan);
    const warna = (u) => (u === 1 ? 'g' : u === 2 ? 's' : 'b');
    return `<section class="card">${kepala}${chips}
      <div class="jw-list">${juara.map((x) => `<div class="jw ${warna(x.urutan)}"><span class="jw-bar"></span>${foto(x) || `<span class="jw-ic">${pialaSvg(warna(x.urutan))}</span>`}
        <div class="jw-t"><div class="jw-lb">Juara ${x.urutan}</div><div class="jw-sk">${esc(x.sekha)}</div>${x.alamat ? `<div class="jw-al">${esc(x.alamat)}</div>` : ''}</div>
        <div class="jw-no">No.<b>${esc(x.nomor || '-')}</b></div></div>`).join('')}</div>
      ${harapan.length ? `<div class="jw-hp"><div class="jw-hh">Harapan</div>${harapan.map((x) => `<div class="jw-r">${foto(x, true) || `<span class="jw-n">${x.urutan}</span>`}<span class="jw-s">${x.foto ? `<small class="jw-hl">Harapan ${x.urutan}</small>` : ''}${esc(x.sekha)}${x.alamat ? `<small>${esc(x.alamat)}</small>` : ''}</span><span class="jw-nn">No. ${esc(x.nomor || '-')}</span></div>`).join('')}</div>` : ''}
      <p class="jw-selamat">Selamat kepada para juara ${esc(nama(jk))}! 🎉</p>
    </section>`;
  },
  rapikanPilihan() {
    const f = this.s.form, info = this.s.info;
    if (!info) return;
    if (f.jenis && !this.jenisTerjadwal().some((j) => j.kode === f.jenis)) { f.jenis = ''; f.seri_id = null; }
    if (f.seri_id && !this.grupJadwal().some((x) => x.id === f.seri_id && x.jenis === f.jenis && x.aktif)) f.seri_id = null;
  },
  mount(tab, sub) {
    const lama = this.s.tab;
    this.s.tab = ['daftar', 'jadwal', 'cek', 'tiket', 'juara'].includes(tab) ? tab : 'daftar';
    if (!this.juaraKini() || this.s.tab === 'juara') this.muatJuara();
    if (this.s.tab === 'tiket' && this.s.tiketKode !== sub) { this.s.tiketKode = sub || ''; this.s.tiket = undefined; this.muatTiket(); }
    document.body.classList.remove('is-admin');
    if (!this.s.info && !this.s.loading) { this.muat(); return; }
    this.render();
    if (lama !== this.s.tab) {
      const tabs = $('.tabs');
      if (tabs && window.scrollY > tabs.offsetTop) tabs.scrollIntoView({ block: 'start' });
      if (this.s.tab === 'jadwal' || this.s.tab === 'cek') this.segarkan().then(() => this.renderAman());
    }
  },
  renderAman() {
    const a = document.activeElement;
    if (a && a.closest && a.closest('#app') && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && !['radio', 'checkbox', 'file'].includes(a.type)))) {
      this.s.tundaRender = true; return;
    }
    this.render();
  },
  render() {
    if (Router.aktif !== 'pub') return;
    this.s.tundaRender = false;
    $('#app').innerHTML = this.halaman();
  },
  fokusJudul() {
    const h = $('#judul-step');
    if (h) { h.focus({ preventScroll: true }); const card = h.closest('.card'); if (card) card.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
  },
  fokusError() {
    const w = $('.field.err, .check.err');
    if (!w) return;
    w.scrollIntoView({ block: 'center', behavior: 'smooth' });
    const i = w.querySelector('input:not([type=hidden]), textarea, select');
    if (i) setTimeout(() => i.focus({ preventScroll: true }), 250);
  },
  jenisDipilih() { return this.s.info && this.s.info.jenis.find((j) => j.kode === this.s.form.jenis); },
  seriDipilih() { return this.s.info && this.s.info.seri.find((x) => x.id === this.s.form.seri_id); },
  /* hanya grup yang ada di jadwal terbang (punya seri/hari) yang bisa dipilih peserta */
  grupJadwal() { const info = this.s.info, sesi = new Set(((info && info.sesi) || []).map((x) => x.id)); return ((info && info.seri) || []).filter((x) => x.sesi_id && sesi.has(x.sesi_id)); },
  jenisTerjadwal() { const ada = new Set(this.grupJadwal().filter((x) => x.aktif).map((x) => x.jenis)); return this.s.info.jenis.filter((j) => j.aktif && ada.has(j.kode)); },
  sisaJenis(kode) { return this.grupJadwal().filter((x) => x.jenis === kode && x.aktif).reduce((a, x) => a + Math.max(0, x.kuota - x.terisi), 0); },
  labelGrup(x) {
    if (!x) return '-';
    const info = this.s.info, sesi = (info.sesi || []).find((y) => y.id === x.sesi_id), hari = sesi && (info.hari || []).find((h) => h.id === sesi.hari_id);
    return sesi ? `Seri ${sesi.nama} · Grup ${x.huruf}${hari ? ` · ${hari.nama}` : ''}` : x.nama;
  },
  hapusFile() { if (this.s.fileUrl) URL.revokeObjectURL(this.s.fileUrl); this.s.file = null; this.s.fileUrl = null; },

  /* ---------------- tampilan ---------------- */
  halaman() {
    const s = this.s;
    let isi;
    if (!s.info && s.loading) isi = this.vKerangka();
    else if (!s.info) isi = this.vGagal();
    else if (s.tab === 'jadwal') isi = this.vJadwal();
    else if (s.tab === 'cek') isi = this.vCek();
    else if (s.tab === 'tiket') isi = this.vTiket();
    else if (s.tab === 'juara') isi = this.vJuara();
    else isi = this.vDaftar();
    return `${demoBar()}${this.vHero()}<main class="pub-main" id="main">${this.vTabs()}${isi}${this.vFooter()}</main>`;
  },
  vHero() {
    const info = this.s.info, ev = (info && info.event) || {};
    const aktif = ((info && info.seri) || []).filter((x) => x.aktif);

    const buka = !!ev.pendaftaran_buka;
    const chip = info ? `<span class="chip ${buka ? '' : 'off'}"><i class="dot"></i>${buka ? 'Pendaftaran dibuka' : 'Pendaftaran ditutup'}${buka && ev.batas_daftar ? ` · s/d ${esc(fmtWaktu(ev.batas_daftar))} ${CONFIG.ZONA_WAKTU}` : ''}</span>` : '';

    return `<header class="hero${bg ? ' has-bg' : ''}"${gayaBg}><div class="hero-in">
      <a class="hero-back" href="#">${ico('arrow-l')} Semua event</a>
      ${logo ? `<img class="hero-logo" src="${esc(logo)}" alt="Logo ${esc(ev.nama_event || 'event')}">` : ''}

      <h1>${esc(ev.nama_event || 'Lomba Layangan')}</h1>
      ${String(ev.tema || '').trim() ? `<p class="hero-tema">“${esc(String(ev.tema).trim())}”</p>` : ''}
      <div class="meta">${rentang ? `<span>${ico('cal')}${esc(rentang)}</span>` : ''}${ev.lokasi ? `<span>${ico('pin')}${esc(ev.lokasi)}</span>` : ''}</div>
      <div class="hero-chips">${chip}${urlGambarAman(ev.flyer_url) ? `<button type="button" class="chip chip-btn" data-act="lp.flyer" data-url="${esc(urlGambarAman(ev.flyer_url))}" data-judul="Flyer ${esc(ev.nama_event || '')}">${ico('image')}Lihat flyer</button>` : ''}</div>
    </div>${bg ? '' : HERO_ART}${HERO_WAVES}</header>`;
  },
  vTabs() {

  vKerangka() {

  vStepper(n) {

  hintWA() {
    const n = normWA(this.s.form.no_wa);
    return n ? `<span class="ok-msg">${ico('check')} Konfirmasi dikirim ke ${esc(fmtWA(n))}</span>` : 'Konfirmasi pendaftaran akan dikirim ke nomor ini lewat WhatsApp.';
  },
  hintNomor() {
    const c = this.s.nomorCek, f = this.s.form, j = this.jenisDipilih(), r = teksRentang(j);
    if (!f.jenis) return 'Pilih jenis layangan dulu. Nomor tidak boleh sama dengan peserta lain di jenis yang sama.';

      (g.peserta || []).forEach((p) => { if (!p.kotak) return; const a = m.get(p.kotak) || { status: 'terkonfirmasi' }; m.set(p.kotak, { ...a, nomor: p.nomor || a.nomor, sekha: p.sekha, alamat: p.alamat, grup: g.id }); });
      return m;

  /* ---------------- aksi ---------------- */
  validasiData() {
    const f = this.s.form, e = {};
    if (!f.jenis) e.jenis = 'Pilih jenis layangan.';
    if (!f.seri_id) e.seri_id = f.jenis ? 'Pilih seri dan grup.' : 'Pilih jenis layangan dulu, lalu pilih seri dan grup.';
    if (!String(f.nomor_layangan || '').trim()) e.nomor_layangan = 'Isi nomor layangan.';
    else if (!normNomor(f.nomor_layangan)) e.nomor_layangan = 'Nomor layangan harus angka, maksimal 6 digit.';
    else if (!dalamRentang(rapikanNomor(f.nomor_layangan, this.jenisDipilih()), this.jenisDipilih())) e.nomor_layangan = `Nomor ${this.jenisDipilih().nama} harus di antara ${teksRentang(this.jenisDipilih())}.`;
    if (f.nama_sekha.trim().length < 2) e.nama_sekha = 'Isi nama sekha.';
    if (f.alamat.trim().length < 3) e.alamat = 'Isi alamat sekha.';
    if (!f.no_wa.trim()) e.no_wa = 'Isi nomor WhatsApp.';
    else if (!normWA(f.no_wa)) e.no_wa = 'Nomor WhatsApp tidak valid. Contoh: 0812-3456-7890';
    return e;
  },
  async kirimData(form) {
    if (form.website && form.website.value) return; // jebakan bot

      if (r.status === 'menunggu') st.uangTunggu += r.harga;
      if (r.bukti_hash) { if (!hash.has(r.bukti_hash)) hash.set(r.bukti_hash, []); hash.get(r.bukti_hash).push(r); }
      perWA.set(r.no_wa, (perWA.get(r.no_wa) || 0) + 1);
    }
    const { baca, belumDibaca, tidakTerbaca, sah } = this.indeksMirip(d);
    const cekGrup = this.indeksCek(d, sah);
    st.belumDibaca = belumDibaca.length; st.tidakTerbaca = tidakTerbaca;
    d.hari = (d.hari || []).sort(urutHari); d.sesi = (d.sesi || []).sort(urutSesi);
    const hari = new Map(d.hari.map((h) => [h.id, h])), sesi = new Map(d.sesi.map((x) => [x.id, x]));
    const kotak = new Map();
    for (const r of d.daftar) {
      if (!r.kotak || !AKTIF(r.status)) continue;
      if (!kotak.has(r.seri_id)) kotak.set(r.seri_id, new Map());
      kotak.get(r.seri_id).set(r.kotak, { id: r.id, nomor: r.nomor_layangan, status: r.status });
    }
    // status "selesai dicek" per kelompok (bukti-selesai.sql); catatan lama (Sama/Mirip) tetap dihitung
    const baruIds = new Set();
    const catatan = (d.selesai || []).slice().sort((a, b) => String(a.created_at).localeCompare(String(b.created_at)) || a.id - b.id);
    const grup = [...new Set(cekGrup.values())];
    grup.forEach((g) => {
      const ids = g.rows.map((r) => r.id);
      const cocok = catatan.filter((c) => (c.anggota || []).some((a) => ids.includes(a)));
      g.catatan = cocok;
      g.rec = cocok.length ? cocok[cocok.length - 1] : null;
      const sudah = new Set(cocok.flatMap((c) => c.anggota));
      // hasil per pendaftaran (tandai satu-satu) & hasil kelompok (bermasalah bila ada satu yang bermasalah)
      g.hasilRow = new Map(); cocok.forEach((c) => (c.anggota || []).forEach((a) => { if (ids.includes(a)) g.hasilRow.set(a, c.hasil === 'bermasalah' ? 'bermasalah' : 'sah'); }));
      g.hasil = [...g.hasilRow.values()].includes('bermasalah') ? 'bermasalah' : 'sah';
      g.dicek = ids.filter((x) => sudah.has(x)).length;
      // "baru" = pendaftaran yang masuk SETELAH kelompok ini pernah dicek (bukan sekadar belum ditandai)
      const awal = g.rec ? String(cocok[0].created_at) : '';
      g.baru = g.rec ? g.rows.filter((r) => !sudah.has(r.id) && String(r.created_at) > awal).map((r) => r.id) : [];
      g.selesai = !!g.rec && ids.every((x) => sudah.has(x));
      g.baru.forEach((x) => baruIds.add(x));
    });
    // tanda terakhir per pendaftaran (Benar / Bermasalah) dari semua catatan pengecekan
    const tanda = new Map();
    catatan.forEach((c) => (c.anggota || []).forEach((a) => tanda.set(a, { hasil: c.hasil === 'bermasalah' ? 'bermasalah' : 'sah', rec: c })));
    const perlu = grup.filter((g) => !g.selesai);
    const kat = (k) => perlu.filter((g) => this.katCek(g).k === k).length, perluIds = new Set(perlu.flatMap((g) => g.rows.map((r) => r.id)));
    st.cek = {
      dobel: kat('dobel'), nominal: kat('nominal'), waktu: kat('waktu'), merah: perlu.filter((g) => this.katCek(g).w === 'r').length,
      gabungan: perlu.filter((g) => g.lv === 0).length, perlu: perlu.length, selesai: grup.filter((g) => g.selesai).length,
      kembali: perlu.filter((g) => g.baru.length).length,
      masalah: d.daftar.filter((r) => r.status !== 'ditolak' && (tanda.get(r.id) || {}).hasil === 'bermasalah').length,
      aman: d.daftar.filter((r) => { if (!r.bukti_path || r.status === 'ditolak' || perluIds.has(r.id)) return false; const b = sah(r); return b && !b.gagal; }).length,
    };
    this.idx = { jenis, seri, perSeri, hash, perWA, st, baca, cekGrup, belumDibaca, baruIds, hari, sesi, kotak, tanda };
  },
  baris(id) { return this.s.data && this.s.data.daftar.find((r) => r.id === id); },

  /* ---------------- RINGKASAN ---------------- */
  vRingkasan() {
    const { st } = this.idx, d = this.s.data, ev = d.pengaturan;
    const kuotaTotal = d.seri.filter((x) => x.aktif).reduce((a, x) => a + x.kuota, 0);
    const terisiAktif = d.seri.filter((x) => x.aktif).reduce((a, x) => { const c = this.idx.perSeri.get(x.id); return a + c.menunggu + c.terkonfirmasi; }, 0);
    const sisa = Math.max(0, kuotaTotal - terisiAktif);
    const todo = [];
    const item = (kls, ikon, judul, sub, tombol) => `<div class="todo-item"><div class="ti ${kls}">${ico(ikon)}</div><div class="tt"><b>${judul}</b><span>${sub}</span></div>${tombol}</div>`;
    if (st.menunggu) todo.push(item('warn', 'clock', `${st.menunggu} pendaftaran menunggu verifikasi`, 'Cek bukti transfer, lalu konfirmasi atau tolak.', `<button class="btn btn-sm btn-primary" data-act="adm.verifikasi">Verifikasi ${ico('arrow-r')}</button>`));
    if (st.waBelum) todo.push(item('info', 'chat', `${st.waBelum} konfirmasi WhatsApp belum dikirim`, 'Sudah terkonfirmasi tapi peserta belum menerima pesan WA.', `<button class="btn btn-sm" data-act="adm.filterWa">Kirim</button>`));
    const ck = st.cek;
    if (ck.perlu) {
      const rinci = [ck.dobel && `${ck.dobel} bukti dobel`, ck.nominal && `${ck.nominal} nominal`, ck.waktu && `${ck.waktu} waktu`, ck.gabungan && `${ck.gabungan} bayar gabungan`].filter(Boolean).join(' · ');
      todo.push(item(ck.merah ? 'bad' : 'warn', 'alert', `${ck.perlu} bukti perlu dicek`, rinci + (ck.kembali ? ` · ${ck.kembali} kembali karena ada pendaftaran <b>baru</b>` : ''), `<button class="btn btn-sm" data-act="adm.filterBukti">Periksa ${ico('arrow-r')}</button>`));
    }
    if (ck.masalah) todo.push(item('bad', 'alert', `${ck.masalah} pendaftaran bermasalah`, 'Sudah ditandai bermasalah saat cek bukti — tolak atau hubungi pesertanya.', `<button class="btn btn-sm" data-act="adm.filterMasalah">Lihat ${ico('arrow-r')}</button>`));
    if (!ev.bank_no_rek) todo.push(item('bad', 'bank', 'Rekening panitia belum diisi', 'Peserta belum bisa melihat tujuan transfer.', `<a class="btn btn-sm" href="#admin/pengaturan">Isi</a>`));
    if (!d.hari.length) todo.push(item('bad', 'cal', 'Jadwal terbang belum dibuat', 'Peserta baru bisa mendaftar setelah ada hari, seri, dan grup di jadwal terbang.', `<a class="btn btn-sm" href="#admin/seri">Buat</a>`));
    const masalah = this.s.super ? this.sehatMasalah() : [];
    if (masalah.length) todo.push(item('bad', 'alert', 'Ada kendala sistem', esc(masalah.join(' · ')), `<a class="btn btn-sm" href="${hrefEv('admin/pengaturan')}">Lihat detail</a>`));
    const tanpaTgl = d.hari.filter((h) => !h.tanggal).length;
    if (tanpaTgl) todo.push(item('info', 'cal', `${tanpaTgl} hari belum punya tanggal`, 'Tanggal tampil di formulir dan pesan WA.', `<a class="btn btn-sm" href="#admin/seri">Atur</a>`));
    const kpi = (label, nilai, sub, opsi = {}) => {
      const tag = opsi.act ? 'button' : 'div';

  vGrafik() {
    const HARI = 14, kini = bagianWaktu(new Date()), tHariIni = Date.UTC(kini.y, kini.m - 1, kini.d);
    const bins = Array.from({ length: HARI }, (_, i) => ({ d: new Date(tHariIni - (HARI - 1 - i) * 86400000), n: 0 }));
    const t0 = bins[0].d.getTime();
    for (const r of this.s.data.daftar) {
      const b = bagianWaktu(r.created_at);
      if (!b) continue;
      const i = Math.round((Date.UTC(b.y, b.m - 1, b.d) - t0) / 86400000);
      if (i >= 0 && i < HARI) bins[i].n++;
    }
    const maks = Math.max(0, ...bins.map((b) => b.n)), total = bins.reduce((a, b) => a + b.n, 0);
    const langkah = [1, 2, 3, 4, 5, 6, 8, 10, 12, 15, 20, 25, 30, 40, 50, 60, 80, 100, 125, 150, 200, 250, 300, 400, 500, 1000];
    const step = langkah.find((c) => c * 4 >= maks) || Math.ceil(maks / 4);
    const top = step * 4;
    const W = 600, H = 210, L = 34, R = 10, T = 16, B = 28, pw = W - L - R, ph = H - T - B, slot = pw / HARI, bw = Math.min(24, slot * 0.62);
    const y = (v) => T + ph - (v / top) * ph;
    let svg = '';
    for (let k = 0; k <= 4; k++) {
      const v = step * k, yy = y(v).toFixed(1);
      svg += `<line class="${k === 0 ? 'base' : 'gl'}" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text x="${L - 8}" y="${(+yy + 4).toFixed(1)}" text-anchor="end">${v}</text>`;
    }
    const iMaks = bins.findIndex((b) => b.n === maks && maks > 0);
    bins.forEach((b, i) => {
      const cx = L + slot * i + slot / 2, x0 = cx - bw / 2, yTop = y(b.n), h = T + ph - yTop;
      const label = `${HARI3[b.d.getUTCDay()]}, ${b.d.getUTCDate()} ${BLN[b.d.getUTCMonth()]}`;
      svg += `<rect class="hit" x="${(L + slot * i).toFixed(1)}" y="${T}" width="${slot.toFixed(1)}" height="${ph}" tabindex="0" role="img" aria-label="${label}: ${b.n} pendaftaran" data-n="${b.n}" data-t="${i === HARI - 1 ? 'Hari ini' : label}" data-x="${((cx / W) * 100).toFixed(2)}" data-y="${((Math.min(yTop, T + ph - 2) / H) * 100).toFixed(2)}"/>`;
      if (b.n > 0) {
        const r = Math.min(4, bw / 2, h);
        svg += `<path class="bar" d="M${x0.toFixed(1)} ${(T + ph).toFixed(1)}V${(yTop + r).toFixed(1)}a${r} ${r} 0 0 1 ${r} -${r}h${(bw - 2 * r).toFixed(1)}a${r} ${r} 0 0 1 ${r} ${r}V${(T + ph).toFixed(1)}z"/>`;
      } else {
        svg += '<path class="bar" d=""/>';
      }
      if ((i === iMaks || i === HARI - 1) && b.n > 0) svg += `<text class="val" x="${cx.toFixed(1)}" y="${(yTop - 5).toFixed(1)}" text-anchor="middle">${b.n}</text>`;
      if (i % 2 === 1 || i === HARI - 1) svg += `<text x="${cx.toFixed(1)}" y="${H - 8}" text-anchor="middle">${i === HARI - 1 ? 'Hari ini' : `${b.d.getUTCDate()}/${b.d.getUTCMonth() + 1}`}</text>`;
    });
    return `<div class="panel-h"><h3>Pendaftaran 14 hari terakhir</h3><span class="hint">${angka(total)} formulir masuk</span></div>
      <div class="chart" id="grafik-harian"><svg viewBox="0 0 ${W} ${H}" role="group" aria-label="Jumlah pendaftaran per hari, 14 hari terakhir">${svg}</svg><div class="tip" hidden></div></div>
      <details class="tbl-toggle"><summary>Lihat sebagai tabel</summary><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Tanggal</th><th class="r">Pendaftaran</th></tr></thead><tbody>
      ${bins.slice().reverse().map((b) => `<tr><td>${HARI3[b.d.getUTCDay()]}, ${b.d.getUTCDate()} ${BLN[b.d.getUTCMonth()]} ${b.d.getUTCFullYear()}</td><td class="r">${b.n}</td></tr>`).join('')}
      </tbody></table></div></details>`;
  },

  vFilter() {

  hasilFilter() {
    const f = this.s.f, d = this.s.data;
    const q = f.q.trim().toLowerCase(), qAngka = q.replace(/\D/g, ''), qWA = normWA(q);
    const rows = d.daftar.filter((r) => {
      if (f.status !== 'semua' && r.status !== f.status) return false;
      if (f.jenis && r.jenis !== f.jenis) return false;
      if (f.seri && String(r.seri_id) !== String(f.seri)) return false;
      if (f.wa && !(r.status === 'terkonfirmasi' && !r.wa_terkirim_at)) return false;
      if (f.cek && !this.idx.cekGrup.has(r.id)) return false;
      if (q) {
        const teks = `${r.kode} ${r.nama_sekha} ${r.alamat} ${r.nama_rekening} ${r.nomor_layangan || ''} ${r.catatan_admin || ''}`.toLowerCase();
        const cocokWA = (qWA && r.no_wa === qWA) || (qAngka.length >= 4 && qAngka.length === q.replace(/[\s+().-]/g, '').length && r.no_wa.includes(qAngka.replace(/^0/, '')));
        if (!teks.includes(q) && !cocokWA) return false;
      }
      return true;
    });
    const posSeri = new Map(d.seri.map((x, i) => [x.id, i])), posJenis = new Map(d.jenis.map((j, i) => [j.kode, i]));
    const byNomor = (a, b) => (a.nomor_urut || 1e9) - (b.nomor_urut || 1e9) || a.created_at.localeCompare(b.created_at);
    const urut = {
      terbaru: (a, b) => b.created_at.localeCompare(a.created_at),
      terlama: (a, b) => a.created_at.localeCompare(b.created_at),
      nomor: (a, b) => (posJenis.get(a.jenis) - posJenis.get(b.jenis)) || byNomor(a, b),

  /* Bukti mirip: nama pengirim sama + nominal sama + waktu di bukti selisih ≤ 1 menit.
     Pasangan yang file-nya identik sudah masuk "Bukti Transfer Sama". */
  indeksMirip(d) {
    const baca = new Map();
    for (const b of d.baca || []) baca.set(b.pendaftaran_id, { ...b, gagal: !b.nominal });   // waktu kosong ≠ gagal: nominal tetap dipakai
    const perluBaca = (r) => r.bukti_path && r.status !== 'ditolak' && !/\.pdf$/i.test(r.bukti_path);
    const sah = (r) => { const b = baca.get(r.id); return b && b.bukti_path === r.bukti_path ? b : null; };
    const belumDibaca = d.daftar.filter((r) => perluBaca(r) && !sah(r));
    const tidakTerbaca = d.daftar.filter((r) => perluBaca(r) && sah(r) && sah(r).gagal).length;
    return { baca, belumDibaca, tidakTerbaca, sah };
  },
  /* Cek Bukti: satu mesin untuk bukti yang dipakai lebih dari satu pendaftaran.
     Tingkat: 3 = pasti sama (file identik / No. Referensi sama), 2 = sangat mungkin (nominal + waktu ≤ 1 menit + 4 angka rekening sama),
     1 = perlu dicek (nominal + waktu + nama sama, rekening tak terbaca), 0 = bayar gabungan (nominal bukti cukup untuk semua). */
  indeksCek(d, sah) {
    const rows = d.daftar.filter((r) => r.bukti_path);
    const induk = rows.map((_, i) => i), lv = rows.map(() => 0), bukti = rows.map(() => new Set());
    const akar = (x) => { while (induk[x] !== x) { induk[x] = induk[induk[x]]; x = induk[x]; } return x; };
    const gabung = (i, k, l, why) => { const x = akar(i), y = akar(k); if (x !== y) { induk[y] = x; lv[x] = Math.max(lv[x], lv[y]); bukti[y].forEach((w) => bukti[x].add(w)); } lv[x] = Math.max(lv[x], l); bukti[x].add(why); };
    const per = (kunci) => { const m = new Map(); rows.forEach((r, i) => { const k = kunci(r); if (k) { if (!m.has(k)) m.set(k, []); m.get(k).push(i); } }); return m; };

      h += `<section class="ck ck-mini ${LV[0]}"><div class="ck-h"><div class="ck-t"><div class="ck-lv"><i></i>${LV[1]}${g.selesai ? ' · selesai dicek' : ''}</div><div class="ck-why">${this.alasanCek(g)}</div></div>${this.vUangCek(g)}</div>${semua}<div class="gm-sum">${ring}</div></section>`;
    }
    if (b && (b.nominal || b.waktu || b.nama || b.ref)) {
      const ms = (w) => (w ? Date.parse(String(w).slice(0, 19) + 'Z') : NaN);
      const kv = [['No. Referensi', b.ref ? `<span class="ck-mono">${esc(b.ref)}</span>` : '—'], ['Rekening pengirim', b.rek4 ? `••${esc(b.rek4)}` : '—'], ['Nama pengirim', esc(b.nama || '—')], ['Nominal', b.nominal ? rupiah(b.nominal) : '—'], ['Waktu transfer', b.waktu ? esc(fmtWaktu(String(b.waktu).slice(0, 19))) : '—']];
      const fl = [];
      const wk = cekWaktuBukti(r, b);
      if (wk) {
        const tr = esc(fmtWaktu(wk.waktu)), df = esc(fmtWaktu(wk.daftar)), d = durasiTeks(wk.sel);
        const sls = g0 && g0.why === 'waktu' && g0.selesai && g0.rec ? ` <i>Sudah dicek: ${g0.rec.hasil === 'bermasalah' ? 'bermasalah' : 'sah'}.</i>` : '';
        if (wk.k === 'wajar') fl.push(['bad', `<b>Waktu tidak wajar:</b> transfer ${tr} — <b>${d} setelah</b> mendaftar (${df}). Buka bukti dan cocokkan tanggalnya.${sls}`, 'clock']);
        else if (wk.k === 'sangat') fl.push(['bad', `<b>Bukti sangat lama:</b> transfer ${tr} — <b>${d} sebelum</b> mendaftar (${df}).${sls}`, 'clock']);
        else fl.push(['w', `<b>Transfer ${d} sebelum daftar.</b> Transfer ${tr} · daftar ${df}. Wajar bila sudah bayar duluan; cek nama pengirim.${sls}`, 'clock']);
      }
      const kosong = [!b.nominal && 'nominal', !b.waktu && 'waktu transfer'].filter(Boolean);
      if (kosong.length) { const t = kosong.join(' & '); fl.push(['w', `<b>${t[0].toUpperCase() + t.slice(1)}</b> tidak terbaca otomatis — cocokkan manual dengan gambar bukti.`]); }
      if (!g) fl.push(['ok', 'Bukti tidak dipakai pendaftaran lain.']);
      h += `<details class="ck-baca"><summary class="ck-baca-h"><span>Terbaca dari bukti</span><span class="ck-baca-r">${b.nominal ? rupiah(b.nominal) : 'lihat'}<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></summary>${kv.map(([k, v]) => `<div class="kv"><span>${k}</span><b>${v}</b></div>`).join('')}</details>
        ${fl.map(([k, t, ic]) => `<div class="ck-fl ${k}">${ic ? ico(ic) : k === 'ok' ? ico('check') : ico('alert')}<span>${t}</span></div>`).join('')}`;
    } else if (b) h += `<div class="ck-fl w">${ico('alert')}<span>Isi bukti tidak terbaca otomatis — cocokkan manual dengan gambar bukti.</span></div>`;
    return h;
  },
  /* ---- Periksa bukti: satu mesin untuk tombol manual & mode otomatis ----
     Otomatis berjalan di latar belakang selama dashboard terbuka (saat dibuka & tiap ada
     pendaftaran baru). Pengaturan per perangkat; bawaan: aktif di laptop, mati di HP. */
  otomatisAktif() {
    const v = bacaLokal('lomba_periksa_otomatis');
    if (v === true || v === false) return v;
    return !(window.matchMedia && matchMedia('(pointer: coarse)').matches);
  },
  autoPeriksa() {
    const d = this.s.data;
    if (!d || d.baca == null || !this.otomatisAktif() || this.s.ocrGagalAuto) return;
    if ((this.s.pb && this.s.pb.jalan) || !this.idx.belumDibaca.length) return;
    this.jalankanPeriksa('auto');
  },
  /* bukti yang belum dibaca, langsung dari data terbaru (ikut menangkap pendaftaran yang baru masuk) */
  /* baca ulang: bacaan versi 1 (belum ada No. Ref & rekening), atau yang nominal/waktunya belum terbaca sebelum versi 3 */
  perluBacaUlang(b) { const v = b.versi || 1; return v < 2 || (v < 4 && (!b.nominal || !b.waktu || !b.ref)); },
  antreanBaca(sudah) {
    const d = this.s.data; if (!d) return [];
    const baca = new Map((d.baca || []).map((b) => [b.pendaftaran_id, b]));
    return d.daftar.filter((r) => r.bukti_path && r.status !== 'ditolak' && !/\.pdf$/i.test(r.bukti_path) && !sudah.has(r.id)
      && !(baca.get(r.id) && baca.get(r.id).bukti_path === r.bukti_path && (api.bacaLama || !this.perluBacaUlang(baca.get(r.id)))))
      .sort((a, b) => b.created_at.localeCompare(a.created_at));     // yang terbaru dulu
  },
  async jalankanPeriksa(mode) {
    if (this.s.pb && this.s.pb.jalan) { if (mode === 'manual') this.s.pb.mode = 'manual'; return this.s.pb; }
    const pb = this.s.pb = { jalan: true, batal: false, mode, i: 0, n: 0, ok: 0, gagal: 0, ocrError: null, kini: '', cekAwal: this.idx.st.cek.perlu };
    const sudah = new Set();
    let ocr = null;
    this.tampilPeriksa();
    while (!pb.batal) {
      const antre = this.antreanBaca(sudah);
      if (!antre.length) break;
      const r = antre[0]; sudah.add(r.id);
      pb.n = pb.i + antre.length; pb.kini = `${r.nama_sekha} (${r.kode})`;
      this.tampilPeriksa();
      try {
        const contoh = api.bacaContoh ? api.bacaContoh(r.bukti_path) : null;
        let hasil = { nominal: null, waktu: null, nama: null, ref: null, rek4: null };
        if (contoh) hasil = { nominal: contoh.nominal, waktu: contoh.waktu, nama: contoh.nama, ref: contoh.ref || null, rek4: contoh.rek4 || null };
        else {
          const res = await fetch(await this.urlBukti(r.bukti_path));      // gangguan jaringan → dicoba lagi lain kali
          if (!ocr) { try { ocr = await siapkanOCR(); } catch (e) { pb.ocrError = e; throw e; } }
          let bmp = null;
          try { bmp = res.ok ? await createImageBitmap(await res.blob()) : null; } catch (e) { bmp = null; }   // file rusak/hilang → "tidak terbaca"
          if (bmp) {
            const rekP = String((this.s.data && this.s.data.pengaturan.bank_no_rek) || '').replace(/\D/g, '').slice(-4);
            const teks1 = (await ocr.recognize(kanvasOCR(bmp))).data.text;
            hasil = bacaTeksBukti(teks1, rekP);
            if (!hasil.waktu || !hasil.ref || !hasil.nominal) {          // baca ulang bagian atas yang diperbesar
              const teks2 = (await ocr.recognize(kanvasOCRAtas(bmp))).data.text, h2 = bacaTeksBukti(teks2, rekP), hg = bacaTeksBukti(teks2 + '\n' + teks1, rekP);
              for (const k of ['waktu', 'ref', 'nominal', 'nama', 'rek4']) if (!hasil[k]) hasil[k] = h2[k] || hg[k] || null;
            }
            if (bmp.close) bmp.close();
            const thD = (bagianWaktu(r.created_at) || {}).y, thT = hasil.waktu ? +String(hasil.waktu).slice(0, 4) : null;
            if (thT && thD && (thT < thD - 1 || thT > thD)) hasil.waktu = null;   // mis. "2096" hasil salah baca
          }
        }
        const simpan = await api.simpanBacaan({ pendaftaran_id: r.id, bukti_path: r.bukti_path, ...hasil, versi: BACA_VERSI, gagal: !hasil.nominal });
        const dd = this.s.data;
        if (dd) dd.baca = (dd.baca || []).filter((b) => b.pendaftaran_id !== r.id).concat([simpan]);
        pb.ok++;
      } catch (e) { pb.gagal++; if (pb.ocrError) break; }
      pb.i++;
      if (pb.i % 10 === 0) { this.indeks(); this.segarkanSetelahPeriksa(); }
    }
    try { const segar = await api.muatBacaan(); if (segar && this.s.data) this.s.data.baca = segar; } catch (e) { /* pakai data lokal */ }
    pb.jalan = false;
    if (pb.ocrError && pb.mode === 'auto') this.s.ocrGagalAuto = true;   // jangan diulang terus sampai halaman dimuat ulang
    this.indeks();
    this.segarkanSetelahPeriksa();
    this.tampilPeriksa();
    if (pb.mode === 'auto' && this.idx.st.cek.perlu > pb.cekAwal) toast(`Cek Bukti: ${this.idx.st.cek.perlu - pb.cekAwal} bukti baru perlu dicek. Lihat filter Cek Bukti.`, 'info', 7000);
    return pb;
  },
  /* segarkan daftar tanpa mengganggu: tidak dirender ulang saat panitia sedang mengetik */
  segarkanSetelahPeriksa() {
    const a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && !Overlay.atas()) { const t = $('#pb-chip'); if (t) t.outerHTML = this.vTombolPeriksa(); return; }
    this.segarkanTampilan({ diam: true });
  },
  vTombolPeriksa() {
    const pb = this.s.pb, st = this.idx.st, auto = this.otomatisAktif();
    if (pb && pb.jalan) return `<button type="button" class="tgl on" id="pb-chip" data-act="adm.periksaBukti"><span class="spinner"></span> Memeriksa bukti ${Math.min(pb.i + 1, pb.n)}/${pb.n}</button>`;
    return `<button type="button" class="tgl" id="pb-chip" data-act="adm.periksaBukti" title="${auto ? 'Periksa otomatis aktif di perangkat ini' : 'Periksa otomatis mati di perangkat ini'}">${ico('eye')} Periksa bukti${st.belumDibaca ? ` <small class="baru">${st.belumDibaca} baru</small>` : auto ? ' <small>otomatis</small>' : ''}</button>`;
  },
  /* perbarui tombol di filter + isi jendela (bila terbuka) */
  tampilPeriksa() {
    const pb = this.s.pb; if (!pb) return;
    const chip = $('#pb-chip'); if (chip) chip.outerHTML = this.vTombolPeriksa();
    const bar = $('#pb-bar'), status = $('#pb-status'), btn = $('#pb-tombol');
    if (bar) bar.style.width = `${pb.n ? Math.round((pb.i / pb.n) * 100) : 0}%`;
    if (!status) return;
    if (pb.jalan) { status.textContent = pb.kini ? `Membaca ${Math.min(pb.i + 1, pb.n)} dari ${pb.n}: ${pb.kini}…` : 'Menyiapkan pembaca teks…'; return; }
    if (btn) { btn.textContent = 'Tutup'; btn.dataset.act = 'ovl.tutup'; btn.classList.add('btn-primary'); }
    const st = this.idx.st;
    status.textContent = pb.ocrError ? 'Pembaca teks gagal dimuat. Periksa koneksi internet, lalu klik Periksa bukti lagi.'
      : `${pb.batal ? 'Dihentikan. ' : 'Selesai. '}${pb.ok} bukti diperiksa${pb.gagal ? `, ${pb.gagal} gagal diunduh (dicoba lagi lain kali)` : ''}. ${st.cek.perlu ? `${st.cek.perlu} kelompok bukti perlu dicek (filter Cek Bukti).` : 'Tidak ada bukti yang perlu dicek.'}${st.tidakTerbaca ? ` ${st.tidakTerbaca} bukti yang nominalnya tidak terbaca otomatis — cocokkan manual.` : ''}`;
  },
  async periksaBukti() {
    const d = this.s.data;
    if (d.baca == null) {
      Overlay.modal(`<h3>Fitur Bukti Transfer Mirip belum aktif</h3><p class="lead">Jalankan file <b>bukti-mirip.sql</b> di Supabase → SQL Editor satu kali, lalu muat ulang halaman ini.</p><div class="actions end"><button type="button" class="btn btn-primary" data-act="ovl.tutup">Mengerti</button></div>`);
      return;
    }
    const jalan = this.s.pb && this.s.pb.jalan, n = jalan ? this.s.pb.n - this.s.pb.i : this.idx.belumDibaca.length;
    const auto = this.otomatisAktif();
    Overlay.modal(`<h3>Periksa bukti transfer</h3>
      <p class="lead">${n ? `Membaca nominal, waktu &amp; nama pengirim dari ${n} gambar bukti, lalu mencari yang sama. Pertama kali perlu mengunduh pembaca teks (±5 MB).` : 'Semua bukti sudah diperiksa.'}</p>
      ${n ? `<div class="progres"><span id="pb-bar" style="width:0%"></span></div><p class="hint" id="pb-status" aria-live="polite">Menyiapkan pembaca teks…</p>` : ''}
      <label class="cek-auto"><input type="checkbox" data-ch="adm.autoPeriksa" ${auto ? 'checked' : ''}><span><b>Periksa otomatis di perangkat ini</b><small>Bukti baru dibaca sendiri selama dashboard terbuka. Disarankan di laptop; di HP memakai kuota &amp; baterai.</small></span></label>
      <div class="actions end">${n ? `<button type="button" class="btn" id="pb-tombol" data-act="adm.periksaBatal">${jalan && this.s.pb.mode === 'auto' ? 'Sembunyikan' : 'Hentikan'}</button>` : '<button type="button" class="btn btn-primary" data-act="ovl.tutup">Tutup</button>'}</div>`,
      { onClose: () => { const pb = this.s.pb; if (pb && pb.jalan && pb.mode === 'manual' && !this.otomatisAktif()) pb.batal = true; } });
    if (!n) return;
    if (jalan) { this.s.pb.mode = this.s.pb.mode === 'auto' ? 'auto' : 'manual'; this.tampilPeriksa(); return; }
    this.jalankanPeriksa('manual');
  },
  vRow(r, asal = 'daftar') {
    const x = this.idx.seri.get(r.seri_id), j = this.idx.jenis.get(r.jenis), dj = this.s.data.jenis;
    let wa = ['', '', ''];
    if (r.status === 'terkonfirmasi') wa = r.wa_terkirim_at ? ['sent', 'WA konfirmasi sudah dikirim', 'check'] : ['need', 'WA konfirmasi belum dikirim', 'chat'];
    else if (r.status === 'ditolak' && r.wa_terkirim_at) wa = ['sent', 'WA penolakan sudah dikirim', 'check'];
    const flags = [];
    const g = this.idx.cekGrup.get(r.id);
    const tn = this.idx.tanda && this.idx.tanda.get(r.id), tutup = g && g.selesai && tn;
    if (tn && (tutup || !g)) flags.push(tn.hasil === 'bermasalah'
      ? `<span class="flag ck-flag r" title="Ditandai bermasalah oleh ${esc(labelOleh(tn.rec.oleh) || 'panitia')} · ${esc(fmtWaktu(tn.rec.created_at))}">${ico('alert')}Bermasalah</span>`
      : `<span class="flag ck-flag sls" title="Sempat masuk Cek Bukti, ditandai benar oleh ${esc(labelOleh(tn.rec.oleh) || 'panitia')} · ${esc(fmtWaktu(tn.rec.created_at))}">${ico('check')}Sempat dicek</span>`);
    const wk = tutup ? null : this.waktuRow(r);
    if (wk) { const sls = g && g.why === 'waktu' && g.selesai; flags.push(`<span class="flag ck-flag ${sls ? 'sls' : WK_LABEL[wk.k][0]}" title="Transfer ${esc(fmtWaktu(wk.waktu))} · daftar ${esc(fmtWaktu(wk.daftar))}${sls ? ' (selesai dicek)' : ''}">${ico('clock')}${WK_LABEL[wk.k][1]}${wk.k === 'wajar' ? '' : ` · ${durasiTeks(wk.sel, true)}`}</span>`); }
    if (g && g.why !== 'waktu' && !tutup) { const L = this.lvCek(g); flags.push(`<span class="flag ck-flag ${L[0]}${g.selesai ? ' sls' : ''}" title="Cek Bukti: ${L[1]}${g.selesai ? ' (selesai dicek)' : ''}">${g.lv ? ico('alert') : ico('check')}${L[1]}</span>`); }
    if (this.idx.baruIds && this.idx.baruIds.has(r.id)) flags.push('<span class="flag baru-tag" title="Pendaftaran baru di kelompok yang sebelumnya sudah selesai dicek">BARU</span>');
    if (!r.bukti_path) flags.push('<span class="flag info">Manual</span>');
    const baru = this.idx.baruIds && this.idx.baruIds.has(r.id);
    return `<div class="row${baru ? ' baru-cek' : ''}" role="button" tabindex="0" data-act="adm.buka" data-id="${esc(r.id)}" data-asal="${asal}">
      <span class="c-st">${badgeStatus(r.status)}<span class="kd">${esc(r.kode)}</span></span>
      <span class="c-sekha"><b>${esc(r.nama_sekha)}</b><span>${esc(r.alamat)}</span>${flags.length ? `<span class="flags">${flags.join('')}</span>` : ''}</span>
      <span class="c-jenis"><span class="jtag">${jdot(r.jenis, dj)}${esc((j && j.nama) || r.jenis)}</span></span>
      <span class="c-seri">${esc((x && x.nama) || '-')}<span>${esc(relatif(r.created_at))}</span></span>
      <span class="c-no">${esc(r.nomor_layangan || '—')}</span>
      <span class="c-harga">${rupiah(r.harga)}</span>
      <span class="c-wa ${wa[0]}" title="${wa[1]}">${wa[2] ? ico(wa[2]) + `<span class="sr-only">${wa[1]}</span>` : ''}</span>
      <span class="c-meta"><span class="jtag">${jdot(r.jenis, dj)}${esc((j && j.nama) || r.jenis)}</span><span>· ${esc((x && x.nama) || '-')}</span><span>· ${rupiah(r.harga)}</span><span>· ${esc(relatif(r.created_at))}</span></span>
    </div>`;
  },

  /* ---------------- PENILAIAN & JUARA ---------------- */
  labelPeringkat(kelas, urutan) { return `${kelas === 'juara' ? 'Juara' : 'Harapan'} ${urutan}`; },
  jenisNilai() {
    const d = this.s.data;
    const ok = new Set(d.daftar.filter((r) => r.status === 'terkonfirmasi').map((r) => r.jenis));
    return d.jenis.filter((j) => ok.has(j.kode));
  },
  /* susun peringkat satu jenis dari nilai juri */
  peringkat(jenis) {
    const d = this.s.data, juri = [...(d.juri || [])].sort((a, b) => a.urutan - b.urutan);
    const nil = new Map((d.nilai || []).map((n) => [n.pendaftaran_id + '|' + n.juri_id, n.nilai]));
    // semua layangan terkonfirmasi di jenis ini bisa langsung dinilai; baris penilaian dibuat saat pertama diisi
    const pen = new Map((d.penilaian || []).map((p) => [p.pendaftaran_id, p]));
    const rows = d.daftar.filter((r) => r.jenis === jenis && r.status === 'terkonfirmasi')
      .map((r) => {
        const p = pen.get(r.id) || { pendaftaran_id: r.id, diskualifikasi: false, alasan: null, catatan: '', prioritas: null };
        const skor = juri.map((j) => (nil.has(r.id + '|' + j.id) ? nil.get(r.id + '|' + j.id) : null));
        const terisi = skor.filter((v) => v != null);
        return { p, r, skor, total: terisi.reduce((a, v) => a + v, 0), lengkap: juri.length > 0 && terisi.length === juri.length, kosong: !terisi.length, dq: !!p.diskualifikasi, rank: null, seri: false };
      });
    const urutNo = (a, b) => (a.r.nomor_urut || 1e9) - (b.r.nomor_urut || 1e9);
    const sah = rows.filter((x) => !x.dq && x.lengkap)
      .sort((a, b) => b.total - a.total || (a.p.prioritas ?? 1e9) - (b.p.prioritas ?? 1e9) || urutNo(a, b));
    sah.forEach((x, i) => {
      const prev = sah[i - 1];
      x.rank = prev && prev.total === x.total && (prev.p.prioritas ?? null) === (x.p.prioritas ?? null) ? prev.rank : i + 1;
    });
    sah.forEach((x) => { x.seri = sah.some((y) => y !== x && y.rank === x.rank); });
    const belum = rows.filter((x) => !x.dq && !x.lengkap && !x.kosong).sort(urutNo);
    const kosong = rows.filter((x) => !x.dq && x.kosong).sort(urutNo);
    const dq = rows.filter((x) => x.dq).sort(urutNo);
    return { juri, sah, belum, kosong, dq, semua: rows, urut: [...sah, ...belum, ...dq, ...kosong] };
  },
  vPenilaian() {
    const d = this.s.data, ev = d.pengaturan;
    const top = this.vTopbar('Penilaian & juara', 'Nilai juri dijumlah otomatis, lalu diurutkan per jenis');
    if (d.penilaian == null || d.juara == null) return top + `<div class="note">${ico('info')}<span>Fitur penilaian belum aktif. Jalankan <b>juara.sql</b> di Supabase → SQL Editor, lalu muat ulang.</span></div>`;
    if (!this.s.nilaiBuka) return top + this.vGerbangNilai();
    const jenisList = this.jenisNilai();
    if (!jenisList.length) return top + `<div class="panel"><div class="empty">Belum ada layangan terkonfirmasi untuk dinilai.</div></div>`;
    if (!jenisList.some((j) => j.kode === this.s.nilaiJenis)) this.s.nilaiJenis = jenisList[0].kode;
    const jk = this.s.nilaiJenis, j = this.idx.jenis.get(jk);
    const pk = this.peringkat(jk);
    const nKonf = (kode) => d.daftar.filter((r) => r.jenis === kode && r.status === 'terkonfirmasi').length;
    const adaNilai = new Set((d.nilai || []).map((n) => n.pendaftaran_id));
    (d.penilaian || []).forEach((p) => { if (p.diskualifikasi) adaNilai.add(p.pendaftaran_id); });
    const nDinilai = (kode) => d.daftar.filter((r) => r.jenis === kode && r.status === 'terkonfirmasi' && adaNilai.has(r.id)).length;
    const chips = jenisList.map((x) => `<button type="button" class="nchip ${x.kode === jk ? 'on' : ''}" data-act="adm.nilaiJenis" data-v="${esc(x.kode)}">${jdot(x.kode, d.jenis)}${esc(x.nama)} <small>${nDinilai(x.kode)}/${nKonf(x.kode)}</small>${this.juaraUmum(x.kode) ? ' <span title="Juara sudah diumumkan">🏆</span>' : ''}</button>`).join('');
    const maks = Number(ev.nilai_maks) || 100;
    return top + `
      <div class="nchips" role="tablist" aria-label="Jenis layangan">${chips}</div>
      ${bantuan('nilai', 'Cara mengisi nilai', [
        'Ketik <b>nomor layangan</b> di kotak cari lalu tekan <b>Enter</b> — hanya nomor itu yang tampil.',
        'Isi nilai juri, tekan <b>Enter</b> untuk pindah ke juri berikutnya. Setelah juri terakhir, kursor kembali ke kotak cari.',
        'Nilai sama → tekan <b>Naikkan</b> pada layangan yang lebih unggul. Diskualifikasi wajib diberi alasan.',
        'Setelah selesai: <b>Jadikan juara</b> → periksa daftar → <b>Umumkan</b>. Setelah diumumkan, nilai terkunci.'])}
      ${this.vCatatanAkses(jk)}
      <div class="panel nilai-panel">
        <div class="nilai-alat">
          <label class="nilai-cari">${ico('search')}<input id="nilai-cari" class="input" type="text" inputmode="numeric" placeholder="Ketik nomor layangan lalu Enter" value="${esc(this.s.nilaiCari || '')}" data-in="adm.nilaiCari" autocomplete="off" aria-label="Cari nomor layangan"><button type="button" class="nilai-cari-x" data-act="adm.nilaiCariHapus" aria-label="Hapus pencarian">${ico('x')}</button></label>
          ${this.bolehMenilai() ? `<button type="button" class="btn btn-sm" data-act="adm.nilaiMaks">${ico('sliders')} Nilai 1–${maks}</button>` : ''}
        </div>
        <div id="nilai-isi">${this.vIsiNilai(jk, pk, maks)}</div>
        <div class="nilai-kaki"><span class="hint">${pk.sah.length} layangan berperingkat${pk.belum.length ? ` · ${pk.belum.length} nilai belum lengkap` : ''}${pk.dq.length ? ` · ${pk.dq.length} diskualifikasi` : ''} · ${pk.kosong.length} belum dinilai</span>
          ${this.bolehMenilai() && !this.terkunci(jk) ? `<button type="button" class="btn btn-good" data-act="adm.jadikanJuara" ${pk.sah.length ? '' : 'disabled'}>${ico('trophy')} Jadikan juara</button>` : ''}</div>
      </div>
      ${this.vHasilJuara(jk)}
      ${this.vRiwayatNilai(jk)}`;
  },
  /* isi tabel: 25 teratas, atau hanya nomor yang dicari (pencarian tidak menggambar ulang kotak cari) */
  vIsiNilai(jk, pk, maks) {
    pk = pk || this.peringkat(jk); maks = maks || Number(this.s.data.pengaturan.nilai_maks) || 100;
    const BATAS = 15, cari = (this.s.nilaiCari || '').trim(), j = this.idx.jenis.get(jk);
    const boleh = this.bolehMenilai(), ro = !boleh || this.terkunci(jk);
    const kolom = `--nj:${Math.max(1, pk.juri.length)}`;
    const head = `<div class="nr nh" style="${kolom}"><span>Rank</span><span>No.</span><span>Sekha</span>
      ${pk.juri.map((x, i) => `<span class="nj-h"><input class="nj-nama" value="${esc(x.nama)}" placeholder="Juri ${i + 1}" maxlength="30" data-ch="adm.juriNama" data-id="${x.id}" aria-label="Nama juri ${i + 1}" ${boleh ? '' : 'readonly'}>${boleh && pk.juri.length > 1 ? `<button type="button" class="nj-x" data-act="adm.juriHapus" data-id="${x.id}" title="Hapus juri ${i + 1}" aria-label="Hapus juri ${i + 1}">${ico('x')}</button>` : ''}</span>`).join('')}
      <span class="r">Total</span><span class="nj-tambah">${boleh ? `<button type="button" class="btn btn-xs" data-act="adm.juriTambah">${ico('plus')} Juri</button>` : ''}</span></div>`;
    if (!pk.semua.length) return `<div class="empty">Belum ada layangan ${esc(j ? j.nama : '')} yang terkonfirmasi.</div>`;
    let tampil, info;
    if (cari) {
      const no = normNomor(cari);
      tampil = no == null ? [] : pk.urut.filter((x) => normNomor(x.r.nomor_layangan) === no);
      if (!tampil.length) return `<div class="nilai-info salah">${no == null ? 'Ketik nomor layangan (angka saja).' : `No. ${esc(cari)} tidak ada di ${esc(j ? j.nama : 'jenis ini')} (hanya layangan terkonfirmasi).`}</div>`;
      info = `Menampilkan <b>No. ${esc(tampil[0].r.nomor_layangan)}</b> · ${pk.semua.length - tampil.length} layangan lain disembunyikan`;
    } else {
      tampil = this.s.nilaiSemua ? pk.urut : pk.urut.slice(0, BATAS);
      info = `${this.s.nilaiSemua || pk.urut.length <= BATAS ? `Semua ${pk.urut.length} layangan` : `${BATAS} teratas dari ${pk.urut.length} layangan`} · urut peringkat, yang belum dinilai di bawah`;
    }
    const sisa = cari ? 0 : pk.urut.length - tampil.length;
    const atasSeri = pk.sah.filter((x) => x.seri && x.rank <= 3 + Math.max(6, (this.s.nilaiHarapan || 6)));
    return `<div class="nilai-info">${info}</div>
      <div class="nilai-tbl${cari ? ' cari' : ''}${ro ? ' ro' : ''}">${head}${tampil.map((x) => this.vBarisNilai(x, pk, maks, kolom, ro)).join('')}</div>
      ${sisa > 0 ? `<div class="nilai-sisa">${sisa} layangan lain disembunyikan — ketik nomornya di kotak cari untuk memberi nilai · <button type="button" class="btn-link" data-act="adm.nilaiSemua">Tampilkan semua</button></div>` : ''}
      ${!cari && this.s.nilaiSemua && pk.urut.length > BATAS ? `<div class="nilai-sisa"><button type="button" class="btn-link" data-act="adm.nilaiSemua">Tampilkan ${BATAS} teratas saja</button></div>` : ''}
      <div id="nilai-ulang" class="nilai-ulang" hidden><button type="button" class="btn btn-xs" data-act="adm.nilaiUrut" data-v="peringkat">${ico('refresh')} Urutkan ulang</button></div>
      ${atasSeri.length && !ro ? `<div class="note warn" style="margin-top:12px">${ico('alert')}<span>Ada <b>nilai sama</b> di peringkat ${[...new Set(atasSeri.map((x) => x.rank))].join(', ')}. Klik <b>${ico('arrow-up')} Naikkan</b> pada layangan yang menurut juri lebih unggul.</span></div>` : ''}`;
  },
  vBarisNilai(x, pk, maks, kolom, ro) {
    const r = x.r, id = esc(r.id);
    const kelas = x.rank === 1 ? 'g' : x.rank === 2 ? 's' : x.rank === 3 ? 'b' : x.rank ? 'h' : '';
    const tags = [x.dq ? `<span class="ntag dq">Diskualifikasi</span>` : '', !x.dq && !x.lengkap && !x.kosong ? '<span class="ntag blm">Belum lengkap</span>' : '', x.seri ? '<span class="ntag seri">Nilai sama</span>' : ''].join('');
    return `<div class="nr${x.dq ? ' dq' : ''}${x.seri ? ' seri' : ''}" style="${kolom}" data-pid="${id}">
      <span class="nrk"><b class="rk ${kelas}">${x.dq ? '✕' : x.rank || '—'}</b></span>
      <span class="nno">${esc(r.nomor_layangan || '-')}</span>
      <span class="nsk"><b>${esc(r.nama_sekha)}</b>${tags}
        ${x.dq ? `<small class="nal">Alasan: ${esc(x.p.alasan || '-')}</small>` : ''}
        ${x.seri && !ro ? `<button type="button" class="btn btn-xs nnaik" data-act="adm.nilaiNaik" data-pid="${id}" title="Letakkan di atas yang nilainya sama">${ico('arrow-up')} Naikkan</button>` : ''}
        ${x.p.catatan ? `<small class="ncat">${ico('edit')} ${esc(x.p.catatan)}</small>` : ''}</span>
      <span class="nins">${pk.juri.map((j, i) => `<label class="nin"><span class="nin-l">${esc(j.nama || 'Juri ' + (i + 1))}</span><input type="number" inputmode="numeric" min="0" max="${maks}" step="1" value="${x.skor[i] ?? ''}" data-ch="adm.nilai" data-pid="${id}" data-juri="${j.id}" ${ro ? 'disabled' : ''} aria-label="Nilai ${esc(j.nama || 'juri ' + (i + 1))} untuk nomor ${esc(r.nomor_layangan || '-')}"></label>`).join('')}</span>
      <span class="ntot">${x.kosong ? '' : x.total || (x.lengkap ? 0 : '')}<small>${x.lengkap || x.kosong ? '' : 'sementara'}</small></span>
      <span class="naksi">${ro ? '' : `
        <details class="ae-menu nak-m"><summary class="ae-dots" aria-label="Aksi untuk nomor ${esc(r.nomor_layangan || '-')}">${ico('more')}</summary><div class="ae-pop">
          <button type="button" data-act="adm.nilaiCatatan" data-pid="${id}">${ico('edit')} Catatan</button>
          <button type="button" class="${x.dq ? '' : 'r'}" data-act="adm.nilaiDq" data-pid="${id}">${ico(x.dq ? 'undo' : 'x')} ${x.dq ? 'Batalkan diskualifikasi' : 'Diskualifikasi'}</button></div></details>
        <button type="button" class="btn btn-xs btn-icon nak-d" data-act="adm.nilaiCatatan" data-pid="${id}" title="Catatan" aria-label="Catatan">${ico('edit')}</button>
        <button type="button" class="btn btn-xs nak-d ${x.dq ? '' : 'btn-danger'}" data-act="adm.nilaiDq" data-pid="${id}">${x.dq ? 'Batal DQ' : 'DQ'}</button>`}
      </span></div>`;
  },
  /* hasil juara & status pengumuman */
  vHasilJuara(jk) {
    const d = this.s.data, ev = d.pengaturan, j = this.idx.jenis.get(jk);
    const list = (d.juara || []).filter((x) => x.jenis === jk).sort((a, b) => (a.kelas === b.kelas ? a.urutan - b.urutan : a.kelas === 'juara' ? -1 : 1));
    const umum = this.juaraUmum(jk);
    const status = umum ? `<span class="pill-st good">${ico('check')} Diumumkan ${esc(fmtWaktu(umum.diumumkan_at))}</span>` : list.length ? '<span class="pill-st warn">Draf — belum terlihat publik</span>' : '';
    const wa = (x, r) => r.no_wa ? `<a class="btn btn-xs" target="_blank" rel="noopener" href="${esc(waLink(r.no_wa, `Selamat! Layangan ${j ? j.nama : ''} nomor ${r.nomor_layangan} (${r.nama_sekha}) meraih ${this.labelPeringkat(x.kelas, x.urutan)} di ${ev.nama_event || 'lomba layangan'}. Terima kasih sudah ikut serta.`))}">${ico('chat')} WA</a>` : '';
    return `<div class="panel" style="margin-top:16px"><div class="panel-h"><h3>${ico('trophy')} Juara ${esc(j ? j.nama : '')}</h3>${status}</div>
      ${list.length ? `<div class="jlist">${list.map((x) => { const r = this.baris(x.pendaftaran_id) || {}; const foto = ((d.penilaian || []).find((p) => p.pendaftaran_id === x.pendaftaran_id) || {}).foto_url; return `<div class="jrow ${x.kelas}"><b class="jl">${this.labelPeringkat(x.kelas, x.urutan)}</b><span class="jn">No. ${esc(r.nomor_layangan || '-')}</span><span class="js">${esc(r.nama_sekha || '-')}<small>${esc(r.alamat || '')}</small></span><span class="jfoto">${foto ? `<img src="${esc(urlGambarAman(foto))}" alt="Foto layangan No. ${esc(r.nomor_layangan || '')}">${this.bolehMenilai() ? `<button type="button" class="btn btn-xs btn-icon" data-act="adm.fotoHapus" data-pid="${esc(x.pendaftaran_id)}" title="Hapus foto" aria-label="Hapus foto">${ico('x')}</button>` : ''}` : ''}${this.bolehMenilai() ? `<label class="btn btn-xs" title="Foto layangan (opsional) — tampil di halaman juara menggantikan ikon piala">${ico('image')} ${foto ? 'Ganti' : 'Foto'}<input type="file" accept="image/png,image/jpeg,image/webp" hidden data-ch="adm.fotoJuara" data-pid="${esc(x.pendaftaran_id)}"></label>` : ''}${wa(x, r)}</span></div>`; }).join('')}</div>`
        : '<div class="empty">Belum ada juara untuk jenis ini. Isi nilai lalu klik <b>Jadikan juara</b>.</div>'}
      <div class="jaksi">${umum
        ? (this.s.super ? `<button type="button" class="btn" data-act="adm.umumkan" data-v="0" data-jenis="${esc(jk)}">${ico('undo')} Tarik pengumuman</button>` : '')
        : !this.bolehMenilai() ? '' : `<button type="button" class="btn btn-primary" data-act="adm.umumkan" data-v="1" data-jenis="${esc(jk)}" ${list.length ? '' : 'disabled'}>${ico('send')} Umumkan juara ${esc(j ? j.nama : '')}</button>${list.length ? `<button type="button" class="btn btn-danger" data-act="adm.batalDraf" data-jenis="${esc(jk)}">${ico('trash')} Batalkan draf</button>` : ''}`}
        <span class="hint">Foto layangan & tombol WA bersifat opsional.</span></div></div>`;
  },
  juaraUmum(jk) { return (this.s.data.juara_umum || []).find((u) => u.jenis === jk) || null; },
  /* ---- keamanan penilaian ---- */
  emailSaya() { return String((this.s.sesi && this.s.sesi.email) || '').toLowerCase(); },
  penilaiList() { return (this.s.data.penilai || []).map((p) => String(p.email).toLowerCase()); },
  bolehMenilai() { const p = this.penilaiList(); return !!this.s.super || !p.length || p.includes(this.emailSaya()); },
  terkunci(jk) { const u = this.juaraUmum(jk); return !!u && !u.terbuka; },
  vGerbangNilai() {
    const id = labelOleh(this.emailSaya()) || this.emailSaya();
    return `<div class="panel nilai-gerbang"><form data-submit="adm.nilaiBuka" novalidate>
      <div class="ng-ico">${ico('lock')}</div>
      <h3>Masuk ke Penilaian</h3>
      <p class="lead">Demi keamanan nilai, masukkan password untuk ID <b class="ng-id">${esc(id)}</b></p>
      <input type="text" name="username" value="${esc(this.emailSaya())}" autocomplete="username" hidden>
      <div class="field"><input class="input" type="password" name="pw" id="ng-pw" autocomplete="current-password" placeholder="Password" aria-label="Password" required></div>
      <button type="submit" class="btn btn-primary btn-block">${ico('lock')} Buka penilaian</button>
      <p class="hint">Penilaian tertutup otomatis bila tidak ada aktivitas di halaman ini.</p>
    </form></div>`;
  },
  vCatatanAkses(jk) {
    const j = this.idx.jenis.get(jk), nama = esc(j ? j.nama : jk), u = this.juaraUmum(jk), p = this.penilaiList();
    let h = '';
    if (!this.bolehMenilai()) h += `<div class="note nilai-ro">${ico('eye')}<span>Anda <b>bukan penilai</b> untuk event ini — hanya bisa melihat. Penilai: <b>${p.map((e) => esc(labelOleh(e))).join('</b>, <b>')}</b>. Hubungi super admin bila perlu akses.</span></div>`;
    else if (this.s.super && !p.length) h += `<div class="note">${ico('info')}<span>Belum ada <b>panitia penilai</b> yang ditunjuk, jadi semua panitia event bisa mengisi nilai. Tunjuk penilai di <a href="#panitia">Ruang panitia</a> → tombol ${ico('sliders', 'ico-inline')} <b>Atur event</b> → Admin event.</span></div>`;
    if (u && !u.terbuka) h += `<div class="note warn nilai-kunci">${ico('lock')}<span>Nilai <b>${nama}</b> terkunci — juara sudah diumumkan.${this.s.super ? '' : ' Hanya super admin yang bisa membuka kunci.'}</span>${this.s.super ? `<button type="button" class="btn btn-sm" data-act="adm.bukaKunci" data-jenis="${esc(jk)}" data-v="1">${ico('unlock')} Buka kunci</button>` : ''}</div>`;
    else if (u && u.terbuka) h += `<div class="note bad nilai-kunci">${ico('unlock')}<span>Kunci nilai <b>${nama}</b> sedang <b>dibuka</b> oleh super admin. Juara sudah diumumkan, jadi perubahan langsung terlihat publik.</span>${this.s.super ? `<button type="button" class="btn btn-sm" data-act="adm.bukaKunci" data-jenis="${esc(jk)}" data-v="0">${ico('lock')} Kunci lagi</button>` : ''}</div>`;
    return h;
  },
  vRiwayatNilai(jk) {
    const rw = this.s.data.riwayat_nilai;
    if (rw == null) return '';
    return `<div class="panel" style="margin-top:16px"><div class="panel-h"><h3>${ico('history')} Riwayat nilai · ${esc(this.namaJenis(jk))}</h3><span class="hint">tercatat otomatis, tidak bisa dihapus</span></div><div id="nilai-riwayat">${this.vIsiRiwayat(jk)}</div></div>`;
  },
  vIsiRiwayat(jk) {
    const rows = (this.s.data.riwayat_nilai || []).filter((r) => r.jenis === jk);
    if (!rows.length) return '<div class="empty">Belum ada perubahan nilai di jenis ini.</div>';
    const n = this.s.nilaiRiwayatSemua ? rows.length : Math.min(rows.length, 20);
    const ch = (v, k) => (v == null ? '<span class="ch kos">kosong</span>' : `<span class="ch ${k}">${esc(v)}</span>`);
    const teks = (r) => {
      const no = r.nomor ? `No. ${esc(r.nomor)}` : '';
      switch (r.aksi) {
        case 'nilai': return `${no} · ${esc(r.juri || 'Juri')} ${r.lama == null ? ch(r.baru, 'n') : `${ch(r.lama, 'o')} → ${ch(r.baru, 'n')}${r.baru != null ? ' <span class="rw-tag">diubah</span>' : ' <span class="rw-tag">dihapus</span>'}`}`;
        case 'dq': return `${no} · <b class="rw-dq">Diskualifikasi</b>${r.keterangan ? ` — “${esc(r.keterangan)}”` : ''}`;
        case 'batal_dq': return `${no} · diskualifikasi dibatalkan`;
        case 'juara': return `${ico('trophy')} membuat daftar juara (${esc(r.baru)} layangan)`;
        case 'hapus_juara': return `menghapus daftar juara (${esc(r.lama)} layangan)`;
        case 'umumkan': return `${ico('trophy')} <b>mengumumkan juara</b>`;
        case 'tarik': return `${ico('undo')} menarik pengumuman juara`;
        case 'buka_kunci': return `${ico('unlock')} <b>membuka kunci nilai</b>`;
        case 'kunci': return `${ico('lock')} mengunci nilai lagi`;
        default: return esc(r.aksi);
      }
    };
    return `<div class="rw-list">${rows.slice(0, n).map((r) => `<div class="rw-row"><span class="rw-w">${esc(fmtWaktu(r.at))}</span><span><b>${esc(labelOleh(r.oleh) || '—')}</b> · ${teks(r)}</span></div>`).join('')}</div>
      ${rows.length > 20 ? `<div class="nilai-sisa"><button type="button" class="btn-link" data-act="adm.riwayatSemua">${this.s.nilaiRiwayatSemua ? 'Tampilkan 20 terbaru saja' : `Tampilkan semua (${rows.length})`}</button></div>` : ''}`;
  },
  /* perbarui total, peringkat & tanda tanpa menyusun ulang baris (agar mengetik tidak terganggu) */
  segarkanNilai() {
    const pk = this.peringkat(this.s.nilaiJenis);
    for (const x of pk.semua) {
      const el = document.querySelector(`.nr[data-pid="${CSS.escape(x.r.id)}"]`);
      if (!el) continue;
      const rk = el.querySelector('.rk');
      rk.className = 'rk ' + (x.rank === 1 ? 'g' : x.rank === 2 ? 's' : x.rank === 3 ? 'b' : x.rank ? 'h' : '');
      rk.textContent = x.dq ? '✕' : x.rank || '—';
      el.querySelector('.ntot').innerHTML = `${x.kosong ? '' : x.total || (x.lengkap ? 0 : '')}<small>${x.lengkap || x.kosong ? '' : 'sementara'}</small>`;
      el.classList.toggle('seri', x.seri);
    }
    const u = $('#nilai-ulang'); if (u) u.hidden = false;
  },
  /* ---------------- DETAIL (drawer) ---------------- */
  buka(id) {
    this.s.detail = id;
    if (!this.s.nav.includes(id)) this.s.nav = [id];
    this.renderDetail();
  },
  renderDetail(dariSegar = false) {
    const r = this.baris(this.s.detail);
    const lapisan = this.s.lapisDetail;
    if (!r) { if (lapisan) Overlay.tutup(lapisan); return; }
    if (dariSegar && lapisan) {
      const a = document.activeElement;
      if (a && lapisan.el.contains(a) && /^(TEXTAREA|INPUT)$/.test(a.tagName)) return;
      if (lapisan.versi === r.updated_at) return;
    }
    const html = this.vDetail(r);
    if (lapisan && lapisan.el.isConnected) {
      const aside = lapisan.el.querySelector('.drawer');
      const scroll = aside.querySelector('.drawer-b').scrollTop;
      const sama = lapisan.id === r.id;
      aside.innerHTML = html;
      if (sama) aside.querySelector('.drawer-b').scrollTop = scroll;
    } else {
      this.s.lapisDetail = Overlay.buka(`<div class="ovl" data-ovl-bg><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-judul">${html}</aside></div>`,
        { onClose: () => { this.s.detail = null; this.s.lapisDetail = null; } });
    }
    this.s.lapisDetail.versi = r.updated_at;
    this.s.lapisDetail.id = r.id;
    this.muatBukti(r);
    this.muatRiwayat(r);
  },
  vDetail(r) {
    const x = this.idx.seri.get(r.seri_id), j = this.idx.jenis.get(r.jenis), dj = this.s.data.jenis;
    const nav = this.s.nav, pos = nav.indexOf(r.id);
    const prev = pos > 0 ? nav[pos - 1] : null, next = pos >= 0 && pos < nav.length - 1 ? nav[pos + 1] : null;
    const dup = r.bukti_hash ? (this.idx.hash.get(r.bukti_hash) || []).filter((o) => o.id !== r.id) : [];
    const nWA = (this.idx.perWA.get(r.no_wa) || 1) - 1;
    const tombolNav = (id, ikon, label) => `<button class="btn btn-icon btn-sm" data-act="adm.nav" data-id="${esc(id || '')}" ${id ? '' : 'disabled'} aria-label="${label}">${ico(ikon)}</button>`;
    return `<div class="drawer-h">
        <button class="btn btn-icon btn-ghost" data-act="ovl.tutup" aria-label="Tutup">${ico('x')}</button>

          ${this.vKotakCek(r)}
          ${r.bukti_path ? `<div class="bukti-box" id="bukti-box"><div class="empty"><span class="spinner" style="margin:0 auto"></span></div></div><div class="bukti-tools" id="bukti-tools"></div>` : `<div class="empty-sm">${ico('file')} Tanpa bukti transfer — pendaftaran manual oleh panitia.</div>`}

          <dl class="kv">

            <dt>Alamat</dt><dd>${nl2br(r.alamat)}</dd>
            <dt>Nomor WA</dt><dd><a href="${esc(waLink(r.no_wa))}" target="_blank" rel="noopener">${esc(fmtWA(r.no_wa))}</a>${nWA > 0 ? ` <a href="#" class="hint" data-act="adm.cariWA" data-wa="${esc(r.no_wa)}">· ${nWA} pendaftaran lain</a>` : ''}</dd>
            <dt>Nomor layangan</dt><dd>${r.nomor_layangan ? `<b>${esc(r.nomor_layangan)}</b>` : '<span class="muted">Belum ada</span>'}</dd>
            <dt>Seri & grup</dt><dd>${esc(this.labelGrupAdm(x))}${r.kotak ? ` · kotak ${r.kotak}` : ''}<div class="sub">${esc(jadwalText(x))}</div></dd>

          ${r.status !== 'menunggu' ? `<button class="btn btn-sm" data-act="adm.salinWA" data-id="${esc(r.id)}">${ico('copy')} Salin teks WA</button>` : ''}
          ${r.status === 'terkonfirmasi' ? `<button class="btn btn-sm" data-act="salin" data-teks="${esc(linkTiket(r.kode))}" data-label="Link PDF konfirmasi disalin">${ico('copy')} Salin link PDF</button>
          <button class="btn btn-sm" data-act="adm.pdfUnduh" data-id="${esc(r.id)}">${ico('download')} Unduh PDF</button>
          <button class="btn btn-sm" data-act="adm.pdfWA" data-id="${esc(r.id)}">${ico('file')} Kirim PDF sebagai lampiran</button>` : ''}
          <a class="btn btn-sm" href="${esc(waLink(r.no_wa))}" target="_blank" rel="noopener">${ico('chat')} Chat peserta</a>

  },
  /* riwayat lengkap dari database (riwayat.sql); list = null → ringkasan dari kolom waktu */
  vRiwayat(r, list) {
    const oleh = (e) => (e ? ` oleh <b>${esc(labelOleh(e))}</b>` : '');
    const waktu = (t) => `<small>${esc(fmtWaktu(t))}</small>`;
    const NAMA_KOL = { nama_sekha: 'nama sekha', alamat: 'alamat', no_wa: 'nomor WA', nama_rekening: 'nama rekening', jenis: 'jenis', seri_id: 'grup', kotak: 'kotak', nomor_layangan: 'nomor layangan', harga: 'biaya', catatan_admin: 'catatan' };
    const nilai = (k, v) => (v == null || v === '' ? '–' : k === 'seri_id' ? ((this.idx.seri.get(Number(v)) || {}).nama || v) : k === 'jenis' ? this.namaJenis(v) : k === 'harga' ? rupiah(v) : k === 'no_wa' ? fmtWA(v) : String(v));
    if (!list) {
      return `<ul class="timeline">
        <li>${ico('edit')}<span>Didaftarkan ${waktu(r.created_at)}</span></li>
        ${r.dikonfirmasi_at ? `<li>${ico('check')}<span>Dikonfirmasi${oleh(r.dikonfirmasi_oleh)} ${waktu(r.dikonfirmasi_at)}</span></li>` : ''}
        ${r.status === 'ditolak' && r.ditolak_oleh ? `<li>${ico('x')}<span>Ditolak${oleh(r.ditolak_oleh)}${r.ditolak_at ? ' ' + waktu(r.ditolak_at) : ''}</span></li>` : ''}
        ${r.wa_terkirim_at ? `<li>${ico('chat')}<span>WA ${r.status === 'ditolak' ? 'penolakan' : 'konfirmasi'} dikirim${oleh(r.wa_oleh)} ${waktu(r.wa_terkirim_at)}</span></li>` : ''}
      </ul>`;
    }
    const baris = list.map((x) => {
      const d = x.detail || {};
      switch (x.aksi) {
        case 'daftar': return `<li>${ico('edit')}<span>Didaftarkan peserta lewat formulir ${waktu(x.created_at)}</span></li>`;
        case 'tambah': return `<li>${ico('plus')}<span>Ditambahkan manual${oleh(x.oleh)} ${waktu(x.created_at)}</span></li>`;
        case 'konfirmasi': return `<li class="ok">${ico('check')}<span>Dikonfirmasi${oleh(x.oleh)} ${waktu(x.created_at)}</span></li>`;
        case 'tolak': return `<li class="bad">${ico('x')}<span>Ditolak${oleh(x.oleh)}${d.alasan ? ` — “${esc(d.alasan)}”` : ''} ${waktu(x.created_at)}</span></li>`;
        case 'menunggu': return `<li>${ico('undo')}<span>Dikembalikan ke menunggu${oleh(x.oleh)} ${waktu(x.created_at)}</span></li>`;
        case 'wa': return `<li>${ico('chat')}<span>WA ${esc(d.jenis || 'konfirmasi')} dikirim${oleh(x.oleh)} ${waktu(x.created_at)}</span></li>`;
        case 'ubah': return `<li>${ico('edit')}<span>Data diubah${oleh(x.oleh)}: ${Object.entries(d).map(([k, [a, b]]) => `${esc(NAMA_KOL[k] || k)} <s>${esc(nilai(k, a))}</s> → ${esc(nilai(k, b))}`).join('; ')} ${waktu(x.created_at)}</span></li>`;
        default: return '';
      }
    }).join('');
    // pendaftaran lama (sebelum pencatatan aktif): tambahkan dari kolom waktu yang ada
    const ada = (a) => list.some((x) => x.aksi === a);
    const lama = [
      !ada('daftar') && !ada('tambah') ? `<li>${ico('edit')}<span>Didaftarkan ${waktu(r.created_at)}</span></li>` : '',
      r.dikonfirmasi_at && !ada('konfirmasi') ? `<li class="ok">${ico('check')}<span>Dikonfirmasi${r.dikonfirmasi_oleh ? oleh(r.dikonfirmasi_oleh) : ' <small class="muted">(sebelum pencatatan aktif)</small>'} ${waktu(r.dikonfirmasi_at)}</span></li>` : '',
      r.wa_terkirim_at && !ada('wa') ? `<li>${ico('chat')}<span>WA dikirim${r.wa_oleh ? oleh(r.wa_oleh) : ' <small class="muted">(sebelum pencatatan aktif)</small>'} ${waktu(r.wa_terkirim_at)}</span></li>` : '',
    ].join('');
    return `<ul class="timeline">${lama}${baris}</ul>`;
  },
  async muatRiwayat(r) {
    if (!api.riwayat) return;
    const list = await api.riwayat(r.id).catch(() => null);
    const box = $('#riwayat-box');
    if (box && this.s.detail === r.id && list) box.innerHTML = this.vRiwayat(r, list);
  },
  /* rekap per panitia: siapa mengonfirmasi, menolak, mengirim WA */
  vKinerja() {
    const d = this.s.data;
    if (!d.daftar.length || !('dikonfirmasi_oleh' in d.daftar[0])) return '';
    const m = new Map(), ambil = (e) => { if (!m.has(e)) m.set(e, { konfirmasi: 0, tolak: 0, wa: 0 }); return m.get(e); };
    let tanpa = 0;
    for (const r of d.daftar) {
      if (r.status === 'terkonfirmasi') { if (r.dikonfirmasi_oleh) ambil(r.dikonfirmasi_oleh).konfirmasi++; else tanpa++; }
      if (r.status === 'ditolak' && r.ditolak_oleh) ambil(r.ditolak_oleh).tolak++;
      if (r.wa_terkirim_at && r.wa_oleh) ambil(r.wa_oleh).wa++;
    }
    const rows = [...m.entries()].sort((a, b) => b[1].konfirmasi - a[1].konfirmasi || b[1].wa - a[1].wa);
    if (!rows.length && !tanpa) return '';
    return `<div class="panel" style="margin-top:16px"><div class="panel-h"><h3>Kinerja panitia</h3><span class="hint">dicatat otomatis oleh sistem</span></div>
      <div class="tbl-wrap"><table class="tbl kinerja"><thead><tr><th>Panitia</th><th class="r">Dikonfirmasi</th><th class="r">Ditolak</th><th class="r">WA dikirim</th></tr></thead><tbody>
      ${rows.map(([e, c]) => `<tr><td><b${akunId(e) ? ' class="mono"' : ''}>${esc(labelOleh(e))}</b>${namaLengkap(e) ? `<small>${esc(namaLengkap(e))}</small>` : ''}</td><td class="r">${angka(c.konfirmasi)}</td><td class="r">${angka(c.tolak)}</td><td class="r">${angka(c.wa)}</td></tr>`).join('')}
      ${tanpa ? `<tr class="muted"><td>Belum tercatat <small>dikonfirmasi sebelum pencatatan aktif</small></td><td class="r">${angka(tanpa)}</td><td class="r">–</td><td class="r">–</td></tr>` : ''}
      </tbody></table></div></div>`;
  },
  vAksiDetail(r, next) {
    if (r.status === 'menunggu') {
      return `<div class="drawer-f"><button class="btn btn-danger" data-act="adm.tolak" data-id="${esc(r.id)}">${ico('x')} Tolak</button>
        <button class="btn btn-good" data-act="adm.konfirmasi" data-id="${esc(r.id)}">${ico('check')} Konfirmasi pembayaran</button></div>`;
    }
    const sudah = !!r.wa_terkirim_at;
    const label = r.status === 'terkonfirmasi' ? (sudah ? 'Kirim ulang WA konfirmasi' : 'Kirim WA konfirmasi') : (sudah ? 'Kirim ulang WA penolakan' : 'Kirim WA penolakan');
    return `<div class="drawer-f">
      <a class="btn ${sudah ? '' : r.status === 'terkonfirmasi' ? 'btn-good' : 'btn-primary'}" href="${esc(waLink(r.no_wa, this.pesanWA(r)))}" target="_blank" rel="noopener" data-act="adm.waTerkirim" data-id="${esc(r.id)}"${r.status === 'terkonfirmasi' ? ' title="Pesan berisi link untuk mengunduh PDF konfirmasi"' : ''}>${ico('chat')} ${label}</a>
      ${next ? `<button class="btn" data-act="adm.nav" data-id="${esc(next)}">Berikutnya ${ico('arrow-r')}</button>` : ''}
    </div>`;
  },
  dataPdf(r) {
    const ev = this.s.data.pengaturan, x = this.idx.seri.get(r.seri_id), j = this.idx.jenis.get(r.jenis);
    const sesi = x && x.sesi_id && this.idx.sesi.get(x.sesi_id), hari = sesi && this.idx.hari.get(sesi.hari_id);
    return {
      ev, nomor: r.nomor_layangan, jenis: (j && j.nama) || r.jenis, sekha: r.nama_sekha, alamat: r.alamat, wa: fmtWA(r.no_wa), kode: r.kode,
      hari: hari ? hari.nama : '-', tanggal: fmtTanggal(x && x.tanggal) || (hari ? `${hari.nama} (tanggal menyusul)` : 'Menyusul'), seri: sesi ? `Seri ${sesi.nama} · Grup ${x.huruf}` : ((x && x.nama) || '-'),
      jam: jamText(x) || 'Menyusul', kotak: r.kotak,
    };
  },
  namaPdf(r) { return `Konfirmasi-${String(r.nomor_layangan || r.kode).replace(/[^\w-]+/g, '')}-${String(r.nama_sekha).replace(/[^\w]+/g, '-').replace(/^-|-$/g, '').slice(0, 40)}.pdf`; },
  pesanWA(r, tpl) {
    const ev = this.s.data.pengaturan;
    let t = tpl != null ? tpl : r.status === 'ditolak' ? (ev.template_wa_tolak || TEMPLATE_WA.tolak) : (ev.template_wa_konfirmasi || TEMPLATE_WA.konfirmasi);
    // template lama tanpa {link_konfirmasi}: link tetap ditambahkan di akhir pesan konfirmasi
    if (tpl == null && r.status === 'terkonfirmasi' && !t.includes('{link_konfirmasi}')) t += '\n\nUnduh PDF konfirmasi:\n{link_konfirmasi}';
    return isiTemplate(t, dataTemplate(r, this.idx.seri.get(r.seri_id), this.idx.jenis.get(r.jenis), ev));
  },
  async urlBukti(path) {
    const c = this.s.url[path];
    if (c && c.exp > Date.now()) return c.url;
    const url = await api.urlBukti(path);
    this.s.url[path] = { url, exp: Date.now() + 50 * 60000 };
    return url;
  },
  async muatBukti(r) {
    if (!r.bukti_path) return;
    try {
      const url = await this.urlBukti(r.bukti_path);
      const box = $('#bukti-box'), tools = $('#bukti-tools');
      if (!box || this.s.detail !== r.id) return;
      const pdf = /\.pdf$/i.test(r.bukti_path);
      box.innerHTML = pdf
        ? `<div class="empty">${ico('file')}<div style="margin-top:6px">Bukti transfer berupa PDF</div></div>`
        : `<img src="${esc(url)}" alt="Bukti transfer ${esc(r.kode)}" data-act="adm.zoom" data-url="${esc(url)}">`;
      tools.innerHTML = pdf
        ? `<a class="btn btn-sm" href="${esc(url)}" target="_blank" rel="noopener">${ico('ext')} Buka PDF</a>`
        : `<button class="btn btn-sm" data-act="adm.zoom" data-url="${esc(url)}">${ico('eye')} Perbesar</button><a class="btn btn-sm" href="${esc(url)}" target="_blank" rel="noopener">${ico('ext')} Tab baru</a>`;
    } catch (e) {
      const box = $('#bukti-box');
      if (box && this.s.detail === r.id) box.innerHTML = `<div class="empty">${ico('alert')} ${esc(pesanError(e))}</div>`;
    }
  },

  /* ---------------- aksi data ---------------- */
  async ubah(id, patch, pesanOk, cekVersi = true) {
    const r = this.baris(id);
    try {
      const baru = await api.ubahPendaftaran(id, patch, cekVersi && r ? r.updated_at : null);
      this.gantiBaris(baru);
      if (pesanOk) toast(typeof pesanOk === 'function' ? pesanOk(baru) : pesanOk, 'good');
      return baru;
    } catch (e) {
      if (/DATA_BERUBAH/.test(e.message || '')) { this.tandaiUbah(); await this.muat({ diam: true }); }
      throw e;
    }
  },
  formTolak(r) {
    Overlay.modal(`<form data-submit="adm.tolak" data-id="${esc(r.id)}" novalidate>
      <h3>Tolak pendaftaran?</h3>
      <p class="lead">${esc(r.nama_sekha)} · ${esc(r.kode)}. Kotak di ${esc((this.idx.seri.get(r.seri_id) || {}).nama || 'grup')} dan nomor layangannya dilepas untuk peserta lain.</p>
      <div class="chips">${ALASAN_TOLAK.map((a) => `<button type="button" data-act="adm.pilihAlasan" data-v="${esc(a)}">${esc(a)}</button>`).join('')}</div>
      <div class="field"><label class="label" for="alasan">Alasan (ikut dikirim ke peserta)</label><textarea class="input" id="alasan" name="alasan" rows="3" maxlength="300">${esc(r.alasan_tolak || '')}</textarea></div>
      <div class="actions end"><button type="button" class="btn" data-act="ovl.tutup">Batal</button><button type="submit" class="btn btn-danger-solid">${ico('x')} Tolak pendaftaran</button></div>
    </form>`);
  },
  opsiSeri(jenis, pilih, idAbaikan) {
    const d = this.s.data;
    return d.seri.filter((x) => x.jenis === jenis && (x.sesi_id || String(x.id) === String(pilih) || this.idx.perSeri.get(x.id).menunggu + this.idx.perSeri.get(x.id).terkonfirmasi > 0)).map((x) => {
      const c = this.idx.perSeri.get(x.id), terisi = c.menunggu + c.terkonfirmasi, sisa = x.kuota - terisi;
      const saatIni = String(x.id) === String(pilih);

      return `<option value="${x.id}" ${saatIni ? 'selected' : ''} ${penuh ? 'disabled' : ''}>${esc(this.labelGrupAdm(x))} — ${esc(jadwalText(x, true))} (${saatIni ? 'saat ini' : penuh ? 'penuh' : `sisa ${sisa}`})${x.aktif ? '' : ' · ditutup'}${x.sesi_id ? '' : ' · seri lama'}</option>`;
    }).join('') || '<option value="">Belum ada grup untuk jenis ini di jadwal terbang</option>';
  },
  formPendaftaran(r) {

      <div class="g2">

      </div>

      ${fieldInput({ id: 'm-nomor', name: 'nomor_layangan', label: 'Nomor layangan', value: v.nomor_layangan || '', maxlength: 6, inputmode: 'numeric', hint: 'Angka saja. Tidak boleh sama dengan peserta lain di jenis yang sama.' })}

        ${fieldInput({ id: 'm-rek', name: 'nama_rekening', label: 'Nama pemilik rekening', value: v.nama_rekening, maxlength: 120 })}

      ${!edit ? `<div class="field"><span class="label">Status</span>

        <label class="check" style="margin:0"><input type="radio" name="status" value="menunggu"><span><b>Belum bayar / perlu dicek</b> — masuk antrean verifikasi</span></label></div>` : ''}
      ${fieldInput({ id: 'm-catatan', name: 'catatan_admin', label: 'Catatan admin', value: v.catatan_admin || '', maxlength: 300, opsional: true })}
      <div class="actions end"><button type="button" class="btn" data-act="ovl.tutup">Batal</button><button type="submit" class="btn btn-primary">${edit ? 'Simpan perubahan' : `${ico('plus')} Tambahkan`}</button></div>
    </form>`);

  formTolakMassal() {

  /* status sistem: dicek otomatis sekali per sesi; masalah hanya dirinci untuk super admin */
  sehatMasalah() {
    const h = this.s.health;
    if (!h || h.gagal || api.mode !== 'supabase') return [];
    const m = [];
    if (!h.bucket) m.push('Bucket bukti transfer belum siap');
    if (!h.media) m.push('Bucket logo & latar belum siap');
    if (!(h.storage_policies >= 3)) m.push('Aturan akses Storage belum lengkap');
    if (!h.realtime) m.push('Realtime database belum aktif (data diperbarui tiap 30 detik)');
    return m;

    try { this.s.health = await api.cekSetup(); } catch (e) { this.s.health = { gagal: true }; }
    this.s.sehatJalan = false;
    const h = $('#health'); if (h) h.outerHTML = this.vSehat();
    if (this.s.tab === 'ringkasan' && this.s.super && this.sehatMasalah().length && Router.aktif === 'adm') this.segarkanTampilan({ paksa: true });

    const baris = !h ? `<span class="sehat-ico tunggu">${ico('refresh')}</span><span>Memeriksa sistem…</span>`
